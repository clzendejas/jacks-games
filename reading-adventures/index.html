<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reading">
<meta name="theme-color" content="#0e2334">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Jack's Reading Adventures</title>
<style>
@font-face{font-family:"Andika";src:url("andika-700.woff2") format("woff2");font-weight:700;font-display:swap}
:root{
  /* layout: one screen. level bar and star row on top, the pals in the middle, one big button at the bottom */
  color-scheme: dark;
  --night:#0e2334;
  --night-2:#1b4460;
  --ink:#ffffff;
  --pal-ink:#10263a;
  --sun:#ffd23f;
  --sun-ink:#3b2b00;
  --quiet:rgba(255,255,255,.14);
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
  --letters: "Andika", ui-rounded, "Comic Sans MS", system-ui, sans-serif;
  --ps:120px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 80% at 50% 35%, var(--night-2), var(--night));
  color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
#app{
  height:100%;display:flex;flex-direction:column;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px)
          calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px);
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

#top{display:flex;align-items:center;justify-content:center;gap:4px}
.small{width:46px;height:46px;border-radius:50%;background:var(--quiet);display:grid;place-items:center;flex:none}
.small svg{width:24px;height:24px}
.small.ghost{background:none}
.grow{flex:1}
#top .arrow{width:44px;height:46px;font-size:30px;font-weight:800;line-height:1;opacity:.9}
#top .arrow:disabled{opacity:.2}
#lvlName{font-size:22px;font-weight:800;letter-spacing:.06em;min-width:118px;text-align:center}
#lives{display:flex;justify-content:center;gap:8px;min-height:26px}
#lives[hidden]{display:none}
#lives svg{width:26px;height:26px;color:#ff6fb5;transition:color .2s, transform .2s}
#lives svg.gone{color:var(--quiet);transform:scale(.8)}
#lives.hit{animation:no .4s}
#fail{background:rgba(8,22,34,.86)}
.round{position:relative}
.pips{position:absolute;left:0;right:0;bottom:9px;display:flex;justify-content:center;gap:5px}
.pips i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.22}
.pips i.on{opacity:1}
#hear svg{transform:translateY(-5px)}
#hear.spent{background:var(--quiet);color:rgba(255,255,255,.55);box-shadow:none}
#hear.no{animation:no .4s}
#stars{display:flex;justify-content:center;gap:6px;min-height:30px}
#stars svg{width:28px;height:28px;color:var(--quiet);transition:color .2s, transform .3s}
#stars svg.on{color:var(--sun);transform:scale(1.15)}

#cue{align-self:center;display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 20px;border-radius:99px;
  background:var(--quiet);font-size:20px;font-weight:900;letter-spacing:.06em;transition:background .25s,color .25s}
#cue svg{width:28px;height:28px}
#cue.listen{background:var(--sun);color:var(--sun-ink)}
#cue.pop{animation:cuepop .5s}
@keyframes cuepop{40%{transform:scale(1.15)}}
#turn{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  font-size:40px;font-weight:900;letter-spacing:.04em;color:var(--sun)}
#turn.on{display:flex;animation:turnin .45s}
#turn svg{width:120px;height:120px}
@keyframes turnin{from{transform:scale(.4);opacity:0}}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#pals{transition:opacity .3s}
#pals.out{opacity:0}
#pals{display:grid;gap:calc(var(--ps)*.16);justify-content:center;align-content:center}

/* a pal: a letter on a bright tile, with eyes peeking over the top */
.pal{
  position:relative;width:var(--ps);height:var(--ps);border-radius:26%;
  background:var(--c);color:var(--pal-ink);
  display:grid;place-items:center;
  box-shadow:0 calc(var(--ps)*.07) 0 rgba(0,0,0,.28), inset 0 calc(var(--ps)*-.05) 0 rgba(0,0,0,.12);
  font-family:var(--letters);font-weight:700;font-size:calc(var(--ps)*.62);line-height:1;
  transition:transform .15s, opacity .25s;
}
.pal .glyph{transform:translateY(4%)}
.pal.two{font-size:calc(var(--ps)*.48)}
.eyes{position:absolute;top:calc(var(--ps)*-.13);left:0;right:0;display:flex;justify-content:center;gap:calc(var(--ps)*.07)}
.eye{width:calc(var(--ps)*.24);height:calc(var(--ps)*.24);border-radius:50%;background:#fff;border:calc(var(--ps)*.02) solid var(--pal-ink);position:relative;animation:blink 4.2s infinite}
.eye::after{content:"";position:absolute;width:42%;height:42%;border-radius:50%;background:var(--pal-ink);left:32%;top:36%}
.pal:nth-child(2n) .eye{animation-delay:1.3s}
.pal:nth-child(3n) .eye{animation-delay:2.4s}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.pal.talk{animation:talk .45s}
.pal.yes{animation:yes .7s}
.pal.no,.stop.no{animation:no .4s}
.pal.dim{background:color-mix(in srgb, var(--c) 30%, #10263a);color:rgba(255,255,255,.35);box-shadow:none}
.pal.dim .eye{opacity:.45}
.pal.spot{transform:scale(1.14);z-index:2}
.badge{position:absolute;right:-12%;top:-14%;width:44%;height:44%;border-radius:50%;display:grid;place-items:center;color:#fff;
  border:calc(var(--ps)*.03) solid #fff;animation:badge .35s cubic-bezier(.3,1.6,.5,1);z-index:3}
.badge svg{width:62%;height:62%}
.badge.ok{background:#1f6fd6}
.badge.bad{background:#e0700a}
@keyframes badge{from{transform:scale(0) rotate(-40deg)}}
.bit{position:absolute;left:50%;top:50%;width:calc(var(--ps)*.1);height:calc(var(--ps)*.14);border-radius:3px;pointer-events:none;z-index:4;
  animation:bit .8s ease-out forwards}
@keyframes bit{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.pal.big{--ps:min(58vw,42vh,280px)}
.pal.idle{animation:idle 1.6s infinite}
@keyframes talk{30%{transform:scale(1.12) rotate(-3deg)}60%{transform:scale(1.06) rotate(3deg)}}
@keyframes yes{30%{transform:translateY(-22%) scale(1.1)}55%{transform:translateY(0)}75%{transform:translateY(-10%)}}
@keyframes no{25%{transform:translateX(-7%)}75%{transform:translateX(7%)}}
@keyframes idle{50%{transform:scale(1.04)}}

#bottom{display:flex;justify-content:center;align-items:center;min-height:92px}
.round{
  width:84px;height:84px;border-radius:50%;background:var(--sun);color:var(--sun-ink);
  display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .08s;
}
.round:active{transform:translateY(3px)}
.round svg{width:42px;height:42px}
.round.pulse{animation:pulse 1.4s infinite}
.round[hidden]{display:none}
@keyframes pulse{50%{transform:scale(1.1)}}

.screen{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;overflow:hidden}
.screen.on{display:flex}
#home{background:radial-gradient(120% 80% at 50% 35%, var(--night-2), var(--night));z-index:30}
#win{background:rgba(8,22,34,.82)}
.studio{
  display:flex;align-items:center;gap:8px;padding:8px 16px 8px 12px;border-radius:99px;
  background:var(--sun);color:var(--sun-ink);font-weight:900;font-size:15px;letter-spacing:.12em;
  transform:rotate(-3deg);box-shadow:0 4px 0 rgba(0,0,0,.28);
}
.studio svg{width:20px;height:20px}
.jack{width:min(46vw,200px);aspect-ratio:1;border-radius:50%;border:6px solid var(--sun);background:var(--night-2);overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.28);flex:none}
.jack img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
#win .jack{animation:bounce 1s infinite}
@keyframes bounce{50%{transform:translateY(-16px) rotate(6deg) scale(1.05)}}
.screen h1{margin:0;font-size:38px;line-height:1;font-weight:900;letter-spacing:.04em;text-align:center;text-wrap:balance}
.screen h1 b{display:block;color:var(--sun)}
.trio{display:flex;gap:14px;--ps:64px;padding-top:10px}
.go{width:124px;height:124px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.go svg{width:62px;height:62px}
#play{animation:pulse 1.6s infinite}
#map{background:radial-gradient(120% 80% at 50% 35%, var(--night-2), var(--night));z-index:25;gap:16px;justify-content:center}
#map h2{margin:0 0 6px;font-size:24px;font-weight:900;letter-spacing:.06em;text-align:center}
.stop{
  width:min(100%,420px);min-height:112px;border-radius:26px;padding:14px 18px;
  display:grid;grid-template-columns:84px 1fr 44px;align-items:center;gap:14px;text-align:left;
  background:var(--c);color:var(--pal-ink);box-shadow:0 7px 0 rgba(0,0,0,.28);--ps:64px;
}
.stop:active{transform:translateY(3px)}
.stop .art{display:grid;place-items:center;padding-top:8px}
.stop .name,.stop .sub{display:block}
.stop .name{font-size:22px;font-weight:900;letter-spacing:.03em;line-height:1.1}
.stop .sub{font-size:15px;font-weight:700;opacity:.75;margin-top:4px}
.stop .end svg{width:40px;height:40px}
.stop.locked{background:var(--quiet);color:rgba(255,255,255,.55);box-shadow:none}
.stop.locked:active{transform:none}
.stop.locked .pal{opacity:.45}
.conf{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:conf linear forwards}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){
  .pal.idle,.round.pulse,#play,#win .jack,.eye,.bit{animation:none}
  .bit{display:none}
  .conf{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="small" id="toMap" aria-label="Back to the adventure map"></button>
    <span class="grow"></span>
    <button class="arrow" id="prev" aria-label="Previous level">&#8249;</button>
    <div id="lvlName" aria-live="polite">LEVEL 1</div>
    <button class="arrow" id="fwd" aria-label="Next level">&#8250;</button>
    <span class="grow"></span>
    <span class="small ghost"></span>
  </div>
  <div id="stars" aria-hidden="true"></div>
  <div id="lives" role="img" aria-label="Chances left"></div>
  <div id="cue" aria-live="polite"><span id="cueIcon"></span><span id="cueText"></span></div>
  <div id="stage"><div id="pals"></div><div id="turn"><span id="turnIcon"></span><b>YOUR TURN!</b></div></div>
  <div id="bottom">
    <button class="round" id="hear" aria-label="Hear the sound again" hidden></button>
    <button class="round pulse" id="next" aria-label="Next" hidden></button>
  </div>
</div>

<div class="screen" id="fail">
  <div class="jack"><img src="jack.webp" alt="Jack"></div>
  <h1>LET&rsquo;S TRY<b>AGAIN</b></h1>
  <button class="go" id="retry" aria-label="Start this level again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 3v5h-5"/></svg></button>
</div>

<div class="screen" id="win">
  <div class="jack"><img src="jack.webp" alt="Jack giving a thumbs up"></div>
  <h1>YOU DID IT!</h1>
  <button class="go" id="again" aria-label="Play next level"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4l14 8-14 8z"/></svg></button>
</div>

<div class="screen" id="map">
  <h2>PICK AN ADVENTURE</h2>
  <button class="stop" id="goPals" style="--c:#2f9bff">
    <span class="art" id="artPals"></span>
    <span><span class="name">SOUND PALS</span><span class="sub" id="subPals">LEVEL 1</span></span>
    <span class="end"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4l14 8-14 8z"/></svg></span>
  </button>
  <button class="stop locked" id="goSlide" aria-disabled="true">
    <span class="art" id="artSlide"></span>
    <span><span class="name">WORD SLIDE</span><span class="sub">COMING SOON</span></span>
    <span class="end lock"></span>
  </button>
  <button class="stop locked" id="goBuild" aria-disabled="true">
    <span class="art" id="artBuild"></span>
    <span><span class="name">WORD BUILDER</span><span class="sub">COMING SOON</span></span>
    <span class="end lock"></span>
  </button>
</div>

<div class="screen on" id="home">
  <div class="studio"><svg viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M50 6l13 28 31 4-23 21 6 31-27-15-27 15 6-31L6 38l31-4z"/></svg>JACK&rsquo;S GAMES</div>
  <div class="jack"><img src="jack.webp" alt="Jack giving a thumbs up"></div>
  <div class="trio" id="trio" aria-hidden="true"></div>
  <h1>JACK&rsquo;S READING<b>ADVENTURES</b></h1>
  <button class="go" id="play" aria-label="Play"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4l14 8-14 8z"/></svg></button>
</div>

<script>
/* ---------- the pals, in teaching order (two new pals per level) ---------- */
const ORDER=['s','a','t','p','i','n','m','d','g','o','c','k','e','u','r','h','b','f','l','j','v','w','x','y','z','qu','sh','ch','th','ng'];
const COLORS=['#2f9bff','#ff9a1f','#ffe04a','#ff6fb5','#17d1c0','#b48cff','#f6f1e4','#8fd14f'];
const LAST_NEW=ORDER.length/2;      // level 15 introduces the last pair
const PRACTICE=LAST_NEW+1;          // after that, one endless practice level cycles through every pal
const MAX_STRIKES=3, MAX_HEARS=3;   // three wrong taps restart the level; three free replays per question
const QUESTIONS=8;
const color=id=>COLORS[ORDER.indexOf(id)%COLORS.length];

// one saved record for the whole game, with a section per adventure
let all={pals:{level:1,max:1,miss:{}}};
try{ const s=JSON.parse(localStorage.getItem('reading-adventures')||'{}'); if (s && s.pals) Object.assign(all.pals, s.pals); }catch(e){}
const save=all.pals;                 // Sound Pals progress
if (!save.miss || typeof save.miss!=='object') save.miss={};
function persist(){ try{ localStorage.setItem('reading-adventures', JSON.stringify(all)); }catch(e){} }

const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- sound ---------- */
let ac=null, quiet=null; const raw={}, buf={};
const EMBED=window.SOUND_DATA||null;   // set only in the single-file preview build
const srcOf=id=>EMBED?'data:audio/mpeg;base64,'+EMBED[id]:'sounds/'+id+'.mp3';
function bytes(id){
  if (!EMBED) return fetch(srcOf(id)).then(r=>r.ok?r.arrayBuffer():Promise.reject());
  const s=atob(EMBED[id]), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i);
  return Promise.resolve(u.buffer);
}
function decode(id){
  if (!ac || buf[id] || !raw[id]) return;
  try{ const p=ac.decodeAudioData(raw[id].slice(0), b=>{buf[id]=b;}, ()=>{}); if (p && p.catch) p.catch(()=>{}); }catch(e){}
}
ORDER.forEach(id=>{ bytes(id).then(ab=>{ raw[id]=ab; decode(id); }).catch(()=>{}); });
/* iPhones only start sound from inside a tap, and mute this kind of audio when the ring switch is on silent.
   So every tap (re)starts the audio engine and asks the phone to treat the game as media playback. */
const SILENCE="data:audio/wav;base64,UklGRvQHAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YdAHAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==";
function unlock(){
  try{
    if (navigator.audioSession) navigator.audioSession.type='playback';
    else { if(!quiet){ quiet=new Audio(SILENCE); quiet.loop=true; } if(quiet.paused) quiet.play().catch(()=>{}); }
  }catch(e){}
  try{
    if (!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); Object.keys(raw).forEach(decode); }
    if (ac.state!=='running') ac.resume();
  }catch(e){}
}
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{ try{ if(!document.hidden && ac && ac.state!=='running') ac.resume(); }catch(e){} });
function say(id){
  try{
    if (ac && ac.state==='running' && buf[id]){ const s=ac.createBufferSource(); s.buffer=buf[id]; s.connect(ac.destination); s.start(); return; }
  }catch(e){}
  try{ new Audio(srcOf(id)).play().catch(()=>{}); }catch(e){}   // fallback: plain audio element
}
function tone(f1,f2,dur,vol,delay,type){
  if(!ac) return;
  try{
    const t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f1,t); o.frequency.linearRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
const sfx={
  tap:()=>tone(520,620,.07,.10),
  yes:()=>{tone(660,660,.12,.13);tone(990,990,.2,.13,.11)},
  no:()=>tone(210,150,.18,.13,0,'triangle'),
  fail:()=>{tone(392,392,.22,.13,0,'triangle');tone(330,330,.22,.13,.2,'triangle');tone(262,262,.4,.13,.4,'triangle')},
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,.22,.14,i*.11))
};

/* ---------- drawing ---------- */
function palEl(id, tag){
  const el=document.createElement(tag||'button');
  el.className='pal'+(id.length>1?' two':''); el.style.setProperty('--c',color(id));
  el.innerHTML='<span class="eyes"><span class="eye"></span><span class="eye"></span></span><span class="glyph">'+id+'</span>';
  if (tag!=='div') el.setAttribute('aria-label','Letter '+id);
  return el;
}
function flash(el,cls,ms){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),ms); }
const starSvg='<svg viewBox="0 0 100 100"><path fill="currentColor" d="M50 6l13 28 31 4-23 21 6 31-27-15-27 15 6-31L6 38l31-4z"/></svg>';
function drawStars(n){ $('stars').innerHTML=starSvg.repeat(QUESTIONS); [...$('stars').children].forEach((s,i)=>s.classList.toggle('on',i<n)); }
function header(){
  $('lvlName').textContent=save.level>=PRACTICE?'PRACTICE':'LEVEL '+save.level;
  $('prev').disabled=save.level<=1; $('fwd').disabled=save.level>=save.max;
}
function sizeGrid(count){
  const st=$('stage'), cols=count<=2?count:2, rows=Math.ceil(count/cols);
  const landscape=st.clientWidth>st.clientHeight*1.25 && count>2;
  const c=landscape?count:cols, r=landscape?1:rows;
  const ps=Math.max(70, Math.min(230, (st.clientWidth-16)/(c*1.16), (st.clientHeight-30)/(r*1.3)));
  const g=$('pals'); g.style.setProperty('--ps',ps+'px'); g.style.gridTemplateColumns='repeat('+c+','+ps+'px)';
}

/* ---------- a level: meet the new pals, then find pals by their sound ---------- */
let run=0, known=[], fresh=[], target=null, score=0, lastTarget=null, locked=false, strikes=0, hears=0;
const show=(id,on)=>{ $(id).hidden=!on; };

function start(L){
  L=Math.max(1,Math.min(PRACTICE,L|0));
  run++; save.level=L; if(L>save.max) save.max=L; save.max=Math.min(save.max,PRACTICE); persist(); header();
  $('win').classList.remove('on'); $('fail').classList.remove('on'); $('turn').classList.remove('on'); $('pals').classList.remove('out');
  strikes=0; $('lives').hidden=false; drawLives();
  fresh = L<=LAST_NEW ? ORDER.slice((L-1)*2, L*2) : [];
  known = ORDER.slice(0, Math.min(ORDER.length, L*2));
  score=0; lastTarget=null; drawStars(0);
  fresh.length ? meet() : yourTurn();
}
const ICON={
  listen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>',
  tap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="7"/><path d="M12 1.5v2M12 20.5v2M1.5 12h2M20.5 12h2"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>'
};
function cue(kind){
  const c=$('cue'); c.className=kind;
  $('cueIcon').innerHTML = kind==='listen'?ICON.listen:ICON.tap;
  $('cueText').textContent = kind==='listen'?'LISTEN':'TAP THE PAL YOU HEAR';
  flash(c,'pop',520);
}
function badge(el,kind){ const b=document.createElement('span'); b.className='badge '+kind; b.innerHTML=ICON[kind]; el.appendChild(b); }
function burst(el){
  for(let n=0;n<14;n++){
    const s=document.createElement('span'), a=Math.PI*2*n/14+Math.random()*.4, d=el.offsetWidth*(.7+Math.random()*.5);
    s.className='bit'; s.style.background=COLORS[n%COLORS.length];
    s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',(Math.sin(a)*d-el.offsetWidth*.25)+'px'); s.style.setProperty('--r',(Math.random()*540-270)+'deg');
    el.appendChild(s); setTimeout(()=>s.remove(),850);
  }
}
/* Listen: the new pals are shown together and take turns saying their sound, twice round. Nothing to press. */
async function meet(){
  const my=run;
  show('hear',false); show('next',false); cue('listen'); $('turn').classList.remove('on');
  const g=$('pals'); g.innerHTML=''; sizeGrid(fresh.length);
  const els=fresh.map(id=>{ const el=palEl(id); g.appendChild(el); el.addEventListener('click',()=>{ say(id); flash(el,'talk',460); }); return el; });
  await wait(700); if(my!==run) return;
  for (let pass=0; pass<2; pass++){
    for (let i=0;i<fresh.length;i++){
      els.forEach((e,k)=>{ e.classList.toggle('dim',k!==i); e.classList.toggle('spot',k===i); });
      say(fresh[i]); flash(els[i],'talk',460);
      await wait(pass?1250:1500); if(my!==run) return;
    }
  }
  els.forEach(e=>e.classList.remove('dim','spot'));
  await wait(1100); if(my!==run) return;
  yourTurn();
}
async function yourTurn(){
  const my=run;
  show('hear',false); $('pals').innerHTML=''; cue('find');
  $('turnIcon').innerHTML=ICON.tap; $('turn').classList.add('on'); sfx.yes();
  await wait(1600); if(my!==run) return;
  $('turn').classList.remove('on');
  await wait(500); if(my!==run) return;
  ask();
}
const heart='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.3C.9 8.300 2.800 4.500 6.500 4.500c2 0 3.600 1.100 5.500 3.300 1.900-2.200 3.500-3.300 5.500-3.300 3.700 0 5.600 3.800 4.100 7.200C19.500 16.400 12 21 12 21z"/></svg>';
function drawLives(){ $('lives').innerHTML=heart.repeat(MAX_STRIKES); [...$('lives').children].forEach((s,i)=>s.classList.toggle('gone',i>=MAX_STRIKES-strikes)); }
function drawHear(){
  const left=MAX_HEARS-hears, b=$('hear');
  b.classList.toggle('spent',left<=0);
  b.querySelector('.pips').innerHTML=Array.from({length:MAX_HEARS},(_,i)=>'<i class="'+(i<left?'on':'')+'"></i>').join('');
}
// a strike costs one heart; the third one ends the level. Returns true when the level is over.
function strike(){
  strikes++; drawLives(); flash($('lives'),'hit',420);
  if (strikes<MAX_STRIKES) return false;
  run++; locked=true; show('hear',false);
  setTimeout(()=>{ sfx.fail(); $('fail').classList.add('on'); },700);
  return true;
}
// practice: every pal comes round once before any repeats, the ones he has missed first
function fromQueue(){
  if (!Array.isArray(save.queue) || !save.queue.length){
    save.queue=shuffle(ORDER.filter(id=>save.miss[id]>0)).concat(shuffle(ORDER.filter(id=>!(save.miss[id]>0))));
  }
  let i=save.queue.findIndex(id=>id!==lastTarget); if (i<0) i=0;
  const id=save.queue.splice(i,1)[0]; persist(); return id;
}
function chooseTarget(){
  if (save.level>=PRACTICE) return fromQueue();
  const bag=[];
  known.forEach(id=>{
    if (id===lastTarget && known.length>1) return;
    let w=1+Math.min(3,save.miss[id]||0); if (fresh.includes(id)) w+=2;
    for(let k=0;k<w;k++) bag.push(id);
  });
  return pick(bag);
}
function ask(){
  const my=run; locked=false;
  show('next',false); show('hear',true);
  target=chooseTarget(); lastTarget=target; hears=0; drawHear();
  const n=Math.min(known.length, save.level===1?2:save.level===2?3:4);
  const others=shuffle(known.filter(id=>id!==target)).slice(0,n-1);
  const opts=shuffle([target,...others]);
  const g=$('pals'); g.innerHTML=''; sizeGrid(opts.length);
  opts.forEach(id=>{
    const el=palEl(id); g.appendChild(el);
    el.addEventListener('click',()=>choose(id,el));
  });
  setTimeout(()=>{ if(my===run) say(target); },900);
}
async function choose(id,el){
  if (locked || el.classList.contains('dim')) return;
  const my=run;
  if (id===target){
    locked=true; sfx.yes(); flash(el,'yes',720); badge(el,'ok'); burst(el);
    [...$('pals').children].forEach(p=>{ if(p!==el) p.classList.add('dim'); });
    if (save.miss[target]>0) save.miss[target]--;
    score++; drawStars(score); persist();
    await wait(700); if(my!==run) return; say(target);          // only the right pal ever says its sound
    await wait(1500); if(my!==run) return;
    if (score>=QUESTIONS){ win(); return; }
    show('hear',false); $('pals').classList.add('out');             // quiet beat before the next question
    await wait(800); if(my!==run) return;
    $('pals').classList.remove('out'); ask();
  } else {
    locked=true;                       // a wrong pal stays silent: X, shake, then the question repeats
    save.miss[target]=Math.min(5,(save.miss[target]||0)+1); persist();
    sfx.no(); badge(el,'bad'); flash(el,'no',420); el.classList.add('dim');
    if (strike()) return;
    await wait(1300); if(my!==run) return; say(target);
    locked=false;
  }
}
function win(){
  show('hear',false);
  if (save.level+1>save.max){ save.max=Math.min(PRACTICE,save.level+1); persist(); }
  sfx.win();
  const w=$('win'); w.querySelectorAll('.conf').forEach(c=>c.remove());
  for (let n=0;n<40;n++){
    const c=document.createElement('div'); c.className='conf';
    c.style.left=(Math.random()*100)+'%'; c.style.background=COLORS[n%COLORS.length];
    c.style.animationDuration=(1.8+Math.random()*1.8)+'s'; c.style.animationDelay=(Math.random()*.8)+'s';
    w.appendChild(c);
  }
  w.classList.add('on');
}

/* ---------- buttons ---------- */
$('hear').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';
$('next').innerHTML='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4l14 8-14 8z"/></svg>';
$('hear').insertAdjacentHTML('beforeend','<span class="pips"></span>');
$('hear').addEventListener('click',()=>{
  if (!target || locked) return;
  if (hears<MAX_HEARS){ hears++; say(target); drawHear(); return; }
  sfx.no(); flash($('hear'),'no',420); strike();           // out of replays: pressing again costs a heart
});
$('retry').addEventListener('click',()=>{ sfx.tap(); start(save.level); });
$('again').addEventListener('click',()=>{ sfx.tap(); start(save.level+1); });
$('prev').addEventListener('click',()=>{ if(save.level>1){ sfx.tap(); start(save.level-1); } });
$('fwd').addEventListener('click',()=>{ if(save.level<save.max){ sfx.tap(); start(save.level+1); } });
/* ---------- the adventure map ---------- */
function showMap(){
  run++; target=null; $('turn').classList.remove('on'); $('fail').classList.remove('on');
  $('win').classList.remove('on');
  $('subPals').textContent = save.level>=PRACTICE ? 'PRACTICE' : 'LEVEL '+Math.max(1,save.level|0)+' OF '+LAST_NEW;
  $('map').classList.add('on');
}
$('play').addEventListener('click',()=>{ unlock(); sfx.yes(); $('home').classList.remove('on'); showMap(); });
$('goPals').addEventListener('click',()=>{ unlock(); sfx.tap(); $('map').classList.remove('on'); start(Math.max(1,save.level|0)); });
['goSlide','goBuild'].forEach(id=>$(id).addEventListener('click',()=>{ tone(200,150,.14,.10,0,'triangle'); flash($(id),'no',420); }));
$('toMap').addEventListener('click',()=>{ sfx.tap(); showMap(); });
$('toMap').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>';
const lockSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5" fill="currentColor" stroke="none"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';
document.querySelectorAll('.lock').forEach(e=>e.innerHTML=lockSvg);
$('artPals').appendChild(palEl('s','div')); $('artSlide').appendChild(palEl('a','div')); $('artBuild').appendChild(palEl('t','div'));
window.addEventListener('resize',()=>{ const n=$('pals').children.length; if(n>1) sizeGrid(n); });
['s','a','t'].forEach(id=>$('trio').appendChild(palEl(id,'div')));
header(); drawStars(0);
try{ if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
</script>
</body>
