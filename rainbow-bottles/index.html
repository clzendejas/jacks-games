<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bottles">
<meta name="theme-color" content="#0e2334">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Rainbow Bottles</title>
<style>
:root{
  /* layout: one screen. level bar on top, bottles in the middle, four big round buttons at the bottom */
  color-scheme: dark;
  --night:#0e2334;
  --night-2:#1b4460;
  --glass:rgba(255,255,255,.82);
  --ink:#ffffff;
  --sun:#ffd23f;
  --sun-ink:#3b2b00;
  --quiet:rgba(255,255,255,.14);
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
  --bw:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 80% at 50% 35%, var(--night-2), var(--night));
  color:var(--ink);font-family:var(--font);
  overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
#app{
  height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px)
          calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 16px);
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* top bar */
#top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.small{width:46px;height:46px;border-radius:50%;background:var(--quiet);display:grid;place-items:center}
.small svg{width:24px;height:24px}
.small.off{opacity:.45}
#lvl{display:flex;align-items:center;gap:4px}
#lvl .arrow{width:40px;height:46px;font-size:30px;font-weight:800;line-height:1;opacity:.9}
#lvl .arrow:disabled{opacity:.2}
#lvlName{font-size:22px;font-weight:800;letter-spacing:.06em;min-width:118px;text-align:center}

/* board */
#board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#grid{
  position:relative;display:flex;flex-wrap:wrap;justify-content:center;
  column-gap:calc(var(--bw)*.5);row-gap:calc(var(--bw)*1.3);
  padding-top:calc(var(--bw)*1.4);
}
.bottle{
  position:relative;width:var(--bw);height:calc(var(--bw)*3.3);
  border:3px solid var(--glass);border-top-width:0;
  border-radius:0 0 calc(var(--bw)*.5) calc(var(--bw)*.5);
  background:rgba(255,255,255,.07);
  transition:transform .28s cubic-bezier(.3,.9,.4,1);
  will-change:transform;
}
.bottle::before{ /* rim */
  content:"";position:absolute;left:-7px;right:-7px;top:-3px;height:7px;border-radius:4px;background:var(--glass);
}
.bottle::after{ /* shine */
  content:"";position:absolute;left:14%;top:8%;width:12%;height:62%;border-radius:99px;
  background:rgba(255,255,255,.28);pointer-events:none;
}
.bottle.sel{transform:translateY(calc(var(--bw)*-.45))}
.bottle.pouring{z-index:5}
.bottle.done::before{background:var(--sun)}
.bottle.pop{animation:pop .5s}
.bottle.no{animation:no .35s}
.bottle.hintFrom{animation:hop .6s 3}
.bottle.hintTo{box-shadow:0 0 0 5px var(--sun), 0 0 26px var(--sun)}
@keyframes pop{40%{transform:translateY(-14%) scale(1.06)}}
@keyframes no{25%{transform:translateX(-7%)}75%{transform:translateX(7%)}}
@keyframes hop{50%{transform:translateY(calc(var(--bw)*-.45))}}
.liq{
  position:absolute;inset:0;overflow:hidden;
  border-radius:0 0 calc(var(--bw)*.5 - 3px) calc(var(--bw)*.5 - 3px);
  display:flex;flex-direction:column-reverse;
}
.layer{height:22%;flex:none;display:grid;place-items:center;transition:height .3s linear;overflow:hidden}
.layer span{display:none;font-size:calc(var(--bw)*.42);line-height:1;color:rgba(0,0,0,.42);font-family:"Apple Symbols","Segoe UI Symbol",sans-serif}
body.shapes .layer span{display:block}
.stream{position:absolute;width:7px;border-radius:4px;transform-origin:top;animation:fall .12s linear;z-index:4;pointer-events:none}
@keyframes fall{from{transform:scaleY(0)}}
.spark{position:absolute;font-size:calc(var(--bw)*.7);color:var(--sun);pointer-events:none;animation:rise .9s ease-out forwards;z-index:6}
@keyframes rise{from{opacity:1;transform:translate(-50%,0) scale(.4)}to{opacity:0;transform:translate(-50%,-90px) scale(1.3) rotate(40deg)}}

/* bottom buttons */
#bar{display:flex;justify-content:center;gap:18px}
.big{
  width:64px;height:64px;border-radius:50%;background:var(--sun);color:var(--sun-ink);
  display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.28);
  transition:transform .08s;
}
.big:active{transform:translateY(3px)}
.big svg{width:32px;height:32px}
.big:disabled{background:var(--quiet);color:rgba(255,255,255,.4);box-shadow:none}
.big.nudge{animation:nudge .7s 4}
@keyframes nudge{50%{transform:scale(1.22)}}

/* win */
#win{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:rgba(8,22,34,.78);z-index:20;overflow:hidden;
}
#win.on{display:flex}
#win .star{animation:bounce 1s infinite}
#win h1{margin:0;font-size:34px;font-weight:900;letter-spacing:.05em;text-wrap:balance;text-align:center}
#next{
  width:120px;height:120px;border-radius:50%;background:var(--sun);color:var(--sun-ink);
  display:grid;place-items:center;box-shadow:0 8px 0 rgba(0,0,0,.3);
}
#next svg{width:60px;height:60px}
@keyframes bounce{50%{transform:translateY(-16px) rotate(8deg) scale(1.06)}}
.conf{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:conf linear forwards}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}
/* title screen */
#home{
  position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  padding:24px;background:radial-gradient(120% 80% at 50% 35%, var(--night-2), var(--night));
}
#home.gone{display:none}
.studio{
  display:flex;align-items:center;gap:8px;padding:8px 16px 8px 12px;border-radius:99px;
  background:var(--sun);color:var(--sun-ink);font-weight:900;font-size:15px;letter-spacing:.12em;
  transform:rotate(-3deg);box-shadow:0 4px 0 rgba(0,0,0,.28);
}
.studio svg{width:20px;height:20px}
.jack{
  width:min(54vw,230px);aspect-ratio:1;border-radius:50%;border:6px solid var(--sun);
  background:var(--night-2);overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.28);flex:none;
}
.jack img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
#home h1{margin:0;font-size:46px;line-height:1;font-weight:900;letter-spacing:.04em;text-align:center}
#home h1 b{display:block;color:var(--sun)}
#play{
  width:128px;height:128px;border-radius:50%;background:var(--sun);color:var(--sun-ink);
  display:grid;place-items:center;box-shadow:0 8px 0 rgba(0,0,0,.3);animation:pulse 1.6s infinite;
}
#play svg{width:64px;height:64px}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion: reduce){
  #play{animation:none}
  .bottle.pop,.bottle.hintFrom,#win .star,.big.nudge{animation:none}
  .conf{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="small" id="sound" aria-label="Sound on or off"></button>
    <div id="lvl">
      <button class="arrow" id="prev" aria-label="Previous level">&#8249;</button>
      <div id="lvlName" aria-live="polite">LEVEL 1</div>
      <button class="arrow" id="fwd" aria-label="Next level">&#8250;</button>
    </div>
    <button class="small" id="shapes" aria-label="Show shapes on colors"></button>
  </div>

  <div id="board"><div id="grid"></div></div>

  <div id="bar">
    <button class="big" id="undo" aria-label="Undo"></button>
    <button class="big" id="restart" aria-label="Start level again"></button>
    <button class="big" id="hint" aria-label="Show a hint"></button>
    <button class="big" id="extra" aria-label="Add an empty bottle"></button>
  </div>
</div>

<div id="win">
  <div class="jack star"><img src="jack.webp" alt="Jack giving a thumbs up"></div>
  <h1>YOU DID IT!</h1>
  <button id="next" aria-label="Play next level"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4l14 8-14 8z"/></svg></button>
</div>

<div id="home">
  <div class="studio"><svg viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M50 6l13 28 31 4-23 21 6 31-27-15-27 15 6-31L6 38l31-4z"/></svg>JACK&rsquo;S GAMES</div>
  <div class="jack"><img src="jack.webp" alt="Jack giving a thumbs up"></div>
  <h1>RAINBOW<b>BOTTLES</b></h1>
  <button id="play" aria-label="Play"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4l14 8-14 8z"/></svg></button>
</div>

<script>
// LOGIC-START
const CAP = 4;
const COLORS = [
  {n:'blue',  c:'#2f7bff', g:'●'},
  {n:'orange',c:'#ff9a1f', g:'▲'},
  {n:'yellow',c:'#ffe04a', g:'★'},
  {n:'pink',  c:'#ff4fa3', g:'♥︎'},
  {n:'teal',  c:'#17d1c0', g:'◆'},
  {n:'purple',c:'#9b5cf0', g:'■'},
  {n:'cream', c:'#f6f1e4', g:'✚'},
  {n:'brown', c:'#9a623c', g:'☾'},
];
function spec(L){
  if (L<=2) return [2,1];
  if (L<=5) return [3,2];
  if (L<=9) return [4,2];
  if (L<=14) return [5,2];
  if (L<=20) return [6,2];
  if (L<=30) return [7,2];
  return [8,2];
}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const full = b => b.length===CAP && b.every(x=>x===b[0]);
const solved = s => s.every(b => !b.length || full(b));
const copy = s => s.map(b=>b.slice());
function canPour(s,i,j){
  if (i===j) return false;
  const a=s[i], b=s[j];
  if (!a.length || b.length>=CAP) return false;
  return !b.length || b[b.length-1]===a[a.length-1];
}
function pour(s,i,j){
  const a=s[i], b=s[j], c=a[a.length-1]; let k=0;
  while (a.length && a[a.length-1]===c && b.length<CAP){ b.push(a.pop()); k++; }
  return k;
}
function moves(s){
  const out=[];
  for (let i=0;i<s.length;i++){
    const a=s[i];
    if (!a.length || full(a)) continue;
    const uniform = a.every(x=>x===a[0]);
    let usedEmpty=false;
    for (let j=0;j<s.length;j++){
      if (!canPour(s,i,j)) continue;
      if (!s[j].length){ if (uniform || usedEmpty) continue; usedEmpty=true; out.push([i,j,1]); }
      else out.push([i,j,0]);
    }
  }
  out.sort((x,y)=>y[2]-x[2]); // popped last-first: same-color pours get tried first
  return out;
}
function solve(start, cap){
  const seen=new Set(), stack=[[copy(start),null]];
  while (stack.length){
    const [s,first]=stack.pop();
    if (solved(s)) return first;
    const key=s.map(b=>b.join('')).sort().join('|');
    if (seen.has(key)) continue;
    seen.add(key);
    if (seen.size>cap) return null;
    for (const [i,j] of moves(s)){
      const n=copy(s); pour(n,i,j);
      stack.push([n, first||[i,j]]);
    }
  }
  return null;
}
function makeLevel(L){
  const [nc,ne]=spec(L);
  let last=null;
  for (let t=0;t<400;t++){
    const r=rng(L*7919+13+t*104729);
    const pool=[];
    for (let c=0;c<nc;c++) for (let k=0;k<CAP;k++) pool.push(c);
    for (let i=pool.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    const s=[];
    for (let c=0;c<nc;c++) s.push(pool.slice(c*CAP,c*CAP+CAP));
    for (let e=0;e<ne;e++) s.push([]);
    last=s;
    if (s.some(full)) continue;
    if (solve(s,30000)) return s;
  }
  return last;
}
// shortest solution from here (used for hints, so following hints always makes progress)
function plan(start, cap){
  const key=s=>s.map(b=>b.join('')).sort().join('|');
  const seen=new Set([key(start)]), q=[[copy(start),null]]; let head=0;
  while (head<q.length){
    const [s,first]=q[head++];
    if (solved(s)) return first;
    for (const [i,j] of moves(s)){
      const n=copy(s); pour(n,i,j);
      const k=key(n); if (seen.has(k)) continue;
      seen.add(k); if (seen.size>cap) return null;
      q.push([n, first||[i,j]]);
    }
  }
  return null;
}
// LOGIC-END

/* ---------- state ---------- */
let save={level:1,max:1,mute:false,shapes:false};
try{ Object.assign(save, JSON.parse(localStorage.getItem('rainbow-bottles')||'{}')); }catch(e){}
function persist(){ try{ localStorage.setItem('rainbow-bottles', JSON.stringify(save)); }catch(e){} }

let state=[], history=[], sel=-1, busy=false, extraUsed=false, els=[];
const $=id=>document.getElementById(id);
const grid=$('grid'), board=$('board');
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- icons ---------- */
const I={
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>',
  restart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 3v5h-5"/></svg>',
  hint:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>',
  extra:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h8M6 4v13a3 3 0 006 0V4"/><path d="M18 9v8M14 13h8"/></svg>',
  soundOn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>',
  soundOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
  shapes:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="7" r="4"/><rect x="13" y="13" width="8" height="8" rx="1"/><path d="M17 2l4.5 8h-9z"/><path d="M7 13l1.5 3 3.3.4-2.4 2.3.6 3.3L7 20.4 4 22l.6-3.3-2.4-2.3 3.3-.4z"/></svg>'
};
$('undo').innerHTML=I.undo; $('restart').innerHTML=I.restart; $('hint').innerHTML=I.hint; $('extra').innerHTML=I.extra; $('shapes').innerHTML=I.shapes;

/* ---------- sound ---------- */
let ac=null;
function audio(){
  if (save.mute) return null;
  try{
    if (!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    if (ac.state==='suspended') ac.resume();
  }catch(e){ ac=null; }
  return ac;
}
function tone(f1,f2,dur,vol,delay,type){
  const a=audio(); if(!a) return;
  try{
    const t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f1,t); o.frequency.linearRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
const sfx={
  tap:()=>tone(520,620,.07,.12),
  no:()=>tone(200,150,.14,.12,0,'triangle'),
  pour:(d,fill)=>tone(260+fill*70,520+fill*90,d,.13,0,'triangle'),
  done:()=>{tone(660,660,.12,.16);tone(990,990,.2,.16,.11)},
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,.22,.16,i*.11))
};

/* ---------- render ---------- */
function layout(){
  const n=state.length, rows=n<=5?1:2, cols=Math.ceil(n/rows);
  const W=board.clientWidth-20, H=board.clientHeight-8;
  const bw=Math.max(26, Math.min(72, W/(cols*1.5-.5), H/(rows*4.7)));
  grid.style.setProperty('--bw', bw+'px');
  grid.style.width=(cols*bw+(cols-1)*bw*.5+1)+'px';
}
function layerEl(c){
  const d=document.createElement('div'); d.className='layer'; d.style.background=COLORS[c].c;
  const s=document.createElement('span'); s.textContent=COLORS[c].g; d.appendChild(s); return d;
}
function render(){
  grid.innerHTML=''; els=[];
  state.forEach((b,i)=>{
    const el=document.createElement('button');
    el.className='bottle'+(full(b)?' done':'')+(i===sel?' sel':'');
    el.setAttribute('aria-label','Bottle '+(i+1)+': '+(b.length?b.map(c=>COLORS[c].n).join(', ')+' (last is on top)':'empty'));
    const liq=document.createElement('div'); liq.className='liq';
    b.forEach(c=>liq.appendChild(layerEl(c)));
    el.appendChild(liq);
    el.addEventListener('click',()=>tapBottle(i));
    grid.appendChild(el); els.push(el);
  });
  layout();
  $('lvlName').textContent='LEVEL '+save.level;
  $('prev').disabled=save.level<=1;
  $('fwd').disabled=save.level>=save.max;
  $('undo').disabled=!history.length;
  $('extra').disabled=extraUsed;
  $('sound').innerHTML=save.mute?I.soundOff:I.soundOn;
  $('sound').classList.toggle('off',save.mute);
  $('shapes').classList.toggle('off',!save.shapes);
  document.body.classList.toggle('shapes',save.shapes);
}
function flash(el,cls,ms){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),ms); }
function nudge(){ ['undo','extra'].forEach(id=>{ if(!$(id).disabled) flash($(id),'nudge',2900); }); }

/* ---------- play ---------- */
function start(L){
  save.level=L; if (L>save.max) save.max=L; persist();
  state=makeLevel(L); history=[]; sel=-1; extraUsed=false; busy=false;
  $('win').classList.remove('on');
  render();
}
function tapBottle(i){
  if (busy) return;
  const b=state[i];
  if (sel<0){
    if (!b.length || full(b)){ sfx.no(); flash(els[i],'no',380); return; }
    sel=i; els[i].classList.add('sel'); sfx.tap(); return;
  }
  if (sel===i){ els[i].classList.remove('sel'); sel=-1; sfx.tap(); return; }
  if (canPour(state,sel,i)){ const from=sel; sel=-1; animatePour(from,i); return; }
  // not allowed: wiggle, and if it has something in it pick this one up instead
  els[sel].classList.remove('sel');
  if (b.length && !full(b)){ sel=i; els[i].classList.add('sel'); sfx.tap(); }
  else { sel=-1; sfx.no(); flash(els[i],'no',380); }
}
async function animatePour(i,j){
  busy=true;
  const A=els[i], B=els[j], bw=A.offsetWidth, bh=A.offsetHeight;
  const src=state[i], before=state[j].length, color=src[src.length-1];
  let k=0; for (let n=src.length-1; n>=0 && src[n]===color && before+k<CAP; n--) k++;
  history.push(copy(state));
  const fromLeft=(B.offsetLeft+bw/2) > grid.clientWidth/2;
  const ang=50+(CAP-(src.length-k))*9;
  const lipX=B.offsetLeft+bw/2+(fromLeft?-3:3), lipY=B.offsetTop-bw*.4;
  const dx=fromLeft ? lipX-(A.offsetLeft+bw) : lipX-A.offsetLeft, dy=lipY-A.offsetTop;
  A.style.transformOrigin=fromLeft?'100% 0':'0 0';
  A.classList.remove('sel'); A.classList.add('pouring');
  A.style.transform='translate('+dx+'px,'+dy+'px) rotate('+(fromLeft?ang:-ang)+'deg)';
  await wait(290);
  const dur=240+k*110;
  const st=document.createElement('div'); st.className='stream';
  st.style.cssText='left:'+(lipX-3.5)+'px;top:'+lipY+'px;height:'+(bw*.4+bh*(1-.22*before)-3)+'px;background:'+COLORS[color].c;
  grid.appendChild(st);
  const aL=[...A.querySelectorAll('.layer')].slice(-k), bLiq=B.querySelector('.liq'), bL=[];
  for (let n=0;n<k;n++){ const l=layerEl(color); l.style.height='0'; l.style.transitionDuration=dur+'ms'; bLiq.appendChild(l); bL.push(l); }
  void bLiq.offsetWidth;
  aL.forEach(l=>{ l.style.transitionDuration=dur+'ms'; l.style.height='0'; });
  bL.forEach(l=>l.style.height='22%');
  sfx.pour(dur/1000,before);
  await wait(dur);
  st.remove();
  pour(state,i,j);
  A.style.transform='';
  await wait(270);
  render();
  busy=false;
  if (full(state[j])){
    sfx.done(); flash(els[j],'pop',520);
    const sp=document.createElement('div'); sp.className='spark'; sp.textContent='★';
    sp.style.left=(els[j].offsetLeft+bw/2)+'px'; sp.style.top=(els[j].offsetTop-bw*.3)+'px';
    grid.appendChild(sp); setTimeout(()=>sp.remove(),950);
  }
  if (solved(state)){ busy=true; await wait(650); win(); return; }
  let any=false;
  for (let a=0;a<state.length&&!any;a++) for (let b=0;b<state.length;b++) if (!full(state[a]) && canPour(state,a,b)){ any=true; break; }
  if (!any) nudge();
}
function win(){
  if (save.level+1>save.max){ save.max=save.level+1; persist(); }
  sfx.win();
  const w=$('win');
  w.querySelectorAll('.conf').forEach(c=>c.remove());
  for (let n=0;n<40;n++){
    const c=document.createElement('div'); c.className='conf';
    c.style.left=(Math.random()*100)+'%'; c.style.background=COLORS[n%COLORS.length].c;
    c.style.animationDuration=(1.8+Math.random()*1.8)+'s'; c.style.animationDelay=(Math.random()*.8)+'s';
    w.appendChild(c);
  }
  w.classList.add('on');
}

/* ---------- buttons ---------- */
$('next').addEventListener('click',()=>{ sfx.tap(); start(save.level+1); });
$('prev').addEventListener('click',()=>{ if(!busy && save.level>1){ sfx.tap(); start(save.level-1); } });
$('fwd').addEventListener('click',()=>{ if(!busy && save.level<save.max){ sfx.tap(); start(save.level+1); } });
$('undo').addEventListener('click',()=>{
  if (busy || !history.length) return;
  const n=state.length; state=history.pop(); while (state.length<n) state.push([]);
  sel=-1; sfx.tap(); render();
});
$('restart').addEventListener('click',()=>{ if(!busy){ sfx.tap(); start(save.level); } });
$('extra').addEventListener('click',()=>{
  if (busy || extraUsed) return;
  extraUsed=true; state.push([]); sel=-1; sfx.done(); render();
});
$('hint').addEventListener('click',()=>{
  if (busy) return;
  const m=plan(state,150000);
  if (!m){ sfx.no(); nudge(); return; }
  if (sel>=0){ els[sel].classList.remove('sel'); sel=-1; }
  sfx.tap();
  flash(els[m[0]],'hintFrom',1900); flash(els[m[1]],'hintTo',1900);
});
$('sound').addEventListener('click',()=>{ save.mute=!save.mute; persist(); render(); sfx.tap(); });
$('shapes').addEventListener('click',()=>{ save.shapes=!save.shapes; persist(); sfx.tap(); render(); });
window.addEventListener('resize',layout);
$('play').addEventListener('click',()=>{ $('home').classList.add('gone'); sfx.done(); layout(); });
try{ if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}

start(Math.max(1, save.level|0));
</script>
</body>
