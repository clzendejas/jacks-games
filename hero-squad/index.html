<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hero Squad">
<meta name="theme-color" content="#14213d">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Jack's Hero Squad</title>
<style>
:root{
  color-scheme: dark;
  --night:#14213d;
  --night-2:#27407a;
  --ink:#ffffff;
  --sun:#ffd23f;
  --sun-ink:#3b2b00;
  --quiet:rgba(255,255,255,.14);
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 80% at 50% 30%, var(--night-2), var(--night));
  color:var(--ink);font-family:var(--font);
  overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.screen{
  position:absolute;inset:0;display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px)
          calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 14px);
}
.screen.on{display:flex}
.small{width:48px;height:48px;border-radius:50%;background:var(--quiet);display:grid;place-items:center;flex:none}
.small svg{width:26px;height:26px}
.small.off{opacity:.45}
.pill{display:flex;align-items:center;gap:6px;background:var(--quiet);border-radius:99px;padding:6px 14px 6px 8px;font-weight:800;font-size:22px}
.coin{width:28px;height:28px;border-radius:50%;background:var(--sun);border:3px solid #c98f00;flex:none}

/* map */
#map{overflow-y:auto;-webkit-overflow-scrolling:touch}
#map>*{flex:none}   /* the map scrolls; nothing in it may be squashed to make room */
#mapTop{display:flex;align-items:center;gap:12px}
#mapTop img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#fff;border:3px solid var(--sun);flex:none}
#mapTop h1{margin:0;font-size:clamp(22px,5vw,34px);font-weight:900;letter-spacing:.02em;flex:1;line-height:1.05}
.world{margin-top:18px;border-radius:22px;padding:12px 14px 16px}
.world h2{margin:0 0 10px;font-size:20px;font-weight:900;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.world .dot{width:22px;height:22px;border-radius:6px;border:3px solid rgba(0,0,0,.25)}
.w0{background:rgba(124,207,94,.22)} .w1{background:rgba(160,140,210,.24)} .w2{background:rgba(170,220,245,.22)}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.lv{aspect-ratio:1;border-radius:18px;background:var(--sun);color:var(--sun-ink);font-weight:900;font-size:26px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.28);line-height:1}
.lv:active{transform:translateY(3px)}
.lv .st{font-size:13px;letter-spacing:1px;margin-top:4px;height:14px}
.lv.new{background:#fff;color:#14213d}
.lv:disabled{background:var(--quiet);color:rgba(255,255,255,.5);box-shadow:none}
.lv svg{width:26px;height:26px}

.heroes{margin-top:14px;display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 2px 10px}
.hb{flex:none;width:84px;height:104px;border-radius:18px;background:var(--quiet);border:4px solid transparent;position:relative;display:grid;place-items:center;padding:4px}
.hb img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.hb.on{border-color:var(--sun);background:rgba(255,210,63,.22)}
.hb .tick{position:absolute;right:-8px;top:-8px;width:30px;height:30px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:none;place-items:center}
.hb.on .tick{display:grid}
.hb .tick svg{width:18px;height:18px}
.hb:disabled img{opacity:.3;filter:grayscale(1)}
.hb .need{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-weight:900;font-size:15px;display:none}
.hb:disabled .need{display:block}
.hb .lock{position:absolute;inset:0;display:none;place-items:center}
.hb:disabled .lock{display:grid}
.hb .lock svg{width:30px;height:30px;margin-bottom:14px}
#newHero{display:none;align-items:center;justify-content:center;gap:10px;margin:2px 0 10px;font-weight:900;font-size:20px;letter-spacing:.04em}
#newHero img{width:74px;height:74px;object-fit:contain;border-radius:16px;background:rgba(255,210,63,.22);border:3px solid var(--sun)}

/* game */
#game{padding-left:0;padding-right:0;padding-bottom:0}
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 calc(env(safe-area-inset-right) + 12px) 6px calc(env(safe-area-inset-left) + 12px)}
#lvlName{font-size:24px;font-weight:900;min-width:44px;text-align:center}
#hearts{display:flex;gap:4px}
#hearts svg{width:34px;height:34px;transition:transform .3s, opacity .3s}
#hearts svg.gone{opacity:.25;transform:scale(.7)}
#stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#side{position:absolute;right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:12px}
.big{width:62px;height:62px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;
  box-shadow:0 5px 0 rgba(0,0,0,.28);position:relative;font-weight:900}
.big:active{transform:translateY(3px)}
.big svg{width:32px;height:32px}
.big:disabled{background:var(--quiet);color:rgba(255,255,255,.4);box-shadow:none}
.big .n{position:absolute;right:-4px;top:-6px;min-width:24px;height:24px;border-radius:12px;background:#fff;color:#14213d;font-size:15px;display:grid;place-items:center;padding:0 5px}

/* overlays */
.over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,14,30,.72);z-index:10}
.over.on{display:flex}
.card{background:linear-gradient(#2c4a8c,#1b2f5e);border:4px solid var(--sun);border-radius:28px;padding:22px 26px 24px;text-align:center;
  min-width:270px;max-width:92vw;animation:in .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes in{from{transform:scale(.6);opacity:0}}
.card h2{margin:0 0 8px;font-size:30px;font-weight:900;letter-spacing:.04em}
.card img{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#fff;border:4px solid var(--sun)}
#stars{display:flex;justify-content:center;gap:8px;margin:8px 0 6px}
#stars svg{width:58px;height:58px}
#stars svg.no{opacity:.28;transform:scale(.72)}
#stars svg.yes{animation:star .5s backwards cubic-bezier(.3,1.6,.5,1)}
@keyframes star{from{transform:scale(0) rotate(-90deg)}}
#won .pill{display:inline-flex;margin:6px 0 14px;font-size:26px}
.row{display:flex;justify-content:center;gap:16px;align-items:center}
.big.go{width:84px;height:84px}
.big.go svg{width:44px;height:44px}

/* ---------- home ---------- */
#home{overflow-y:auto}
#home>*{flex:none}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{margin:0;font-size:clamp(20px,4.6vw,32px);font-weight:900;letter-spacing:.04em;flex:1;line-height:1.05}
.top .face{width:60px;height:60px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#fff;border:3px solid var(--sun);flex:none}
.pill img{width:22px;height:32px;object-fit:contain}
.tl{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;letter-spacing:.08em}
.tl b{background:var(--sun);color:var(--sun-ink);border-radius:12px;padding:3px 12px;font-size:22px}
.xp{width:clamp(70px,16vw,190px);height:16px;border-radius:10px;background:rgba(10,18,40,.6);overflow:hidden;border:2px solid rgba(255,255,255,.25)}
.xp i{display:block;height:100%;background:var(--sun);transition:width .6s}
#tiles{flex:1 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;min-height:min(70vh,560px)}
@media (orientation:portrait){ #tiles{grid-template-columns:1fr} }
.tile{position:relative;border-radius:26px;overflow:hidden;min-height:132px;border:4px solid rgba(255,255,255,.2);box-shadow:0 6px 0 rgba(0,0,0,.28);background:#1b2f5e center/cover}
.tile:active{transform:translateY(3px)}
.tile .who{position:absolute;left:0;right:0;top:6%;bottom:46px;display:flex;align-items:flex-end;justify-content:center;gap:2%}
.tile .who img{height:100%;max-width:32%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))}
.tile .name{position:absolute;left:0;right:0;bottom:0;padding:9px 6px;background:rgba(12,20,45,.82);font-weight:900;font-size:clamp(18px,3.4vw,26px);letter-spacing:.08em}

/* ---------- shared pieces ---------- */
.btn{border-radius:99px;background:var(--sun);color:var(--sun-ink);font-weight:900;font-size:19px;padding:11px 18px;box-shadow:0 5px 0 rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.04em}
.btn:active{transform:translateY(3px)}
.btn.dim{background:var(--quiet);color:rgba(255,255,255,.75);box-shadow:none}
.btn img{width:20px;height:30px;object-fit:contain}
.stage{position:relative}
.stage img{position:absolute;inset:8% 8% 26%;width:84%;height:66%;object-fit:contain;pointer-events:none}
.stage.boss{background:#fff;color:#14213d}
.stage.boss .st, .stage.pic .st{position:absolute;left:0;right:0;bottom:5px}

/* ---------- heroes ---------- */
#squad{overflow-y:auto}
#squad>*{flex:none}
#squadBody{display:flex;gap:14px;margin-top:12px;align-items:flex-start}
#roster{flex:1 1 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;min-width:0}
.hc{aspect-ratio:.8;border-radius:16px;background:var(--quiet);border:4px solid transparent;position:relative;display:grid;place-items:center;padding:5px}
.hc img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;min-height:0}
.hc.sel{border-color:var(--sun);background:rgba(255,210,63,.2)}
.hc .lvb{position:absolute;left:4px;top:4px;background:#14213d;border-radius:9px;padding:1px 7px;font-weight:900;font-size:14px}
.hc .in{position:absolute;right:-7px;top:-7px;width:26px;height:26px;border-radius:50%;background:#4aa8ff;border:3px solid #14213d;display:grid;place-items:center}
.hc .in svg{width:14px;height:14px}
.hc.shut img{opacity:.28;filter:grayscale(1)}
.hc .need{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-weight:900;font-size:14px}
#panel{flex:1.15 1 0;min-width:0;border-radius:24px;background:linear-gradient(#2c4a8c,#1b2f5e);border:4px solid var(--sun);padding:14px 16px}
#panel h2{margin:0 0 8px;font-size:clamp(20px,3.6vw,28px);font-weight:900;letter-spacing:.05em}
#pMain{display:flex;gap:12px}
#pLeft{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center}
#pLeft img{width:100%;height:clamp(150px,34vh,300px);object-fit:contain}
.pow{background:var(--sun);color:var(--sun-ink);border-radius:16px;padding:4px 20px;font-weight:900;border:4px solid #14213d;text-align:center;margin-top:6px}
.pow small{display:block;font-size:12px;letter-spacing:.1em}.pow b{font-size:30px;line-height:1}
#pRight{flex:1.1 1 0;min-width:0}
.box{background:rgba(10,18,40,.4);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.box h3{margin:0 0 2px;font-size:13px;letter-spacing:.1em;font-weight:900;opacity:.85}
.box .val{font-size:26px;font-weight:900}
.box .val span{opacity:.7;font-size:20px}
.box .btn{margin-top:8px;width:100%}
.sps{font-size:26px;letter-spacing:3px;color:var(--sun)}.sps i{font-style:normal;opacity:.3;color:#fff}
.note{font-size:14px;font-weight:700;opacity:.85;min-height:18px}
#teamRow{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
#teamRow b{font-size:13px;letter-spacing:.1em}
.slot{width:58px;height:68px;border-radius:12px;background:rgba(10,18,40,.4);border:3px solid #4aa8ff;display:grid;place-items:center;padding:3px}
.slot img{max-width:100%;max-height:100%;object-fit:contain;min-height:0}
.slot.shut{border:3px dashed rgba(255,255,255,.35);font-weight:900;font-size:11px;text-align:center;line-height:1.2}
@media (orientation:portrait){ #squadBody{flex-direction:column-reverse;align-items:stretch} #roster,#panel{flex:none} }

/* ---------- campaign fight ---------- */
#battle{padding-left:0;padding-right:0;padding-bottom:0}
#bTop{display:flex;align-items:center;gap:10px;padding:0 calc(env(safe-area-inset-right) + 12px) 6px calc(env(safe-area-inset-left) + 12px)}
#bName{flex:1;font-weight:900;font-size:clamp(16px,3.4vw,24px);letter-spacing:.06em}
#arena{flex:1;min-height:0;position:relative;z-index:0;overflow:hidden;background:#27407a center 70%/cover}
#vs{position:absolute;left:0;right:0;top:10px;display:flex;justify-content:center;align-items:center;gap:14px;z-index:200}
.sideN{border-radius:18px;padding:5px 16px;font-weight:900;text-align:center;border:4px solid #1d2b3a;min-width:104px}
.sideN small{display:block;font-size:12px;letter-spacing:.1em}.sideN b{font-size:32px;line-height:1}
.sideN.t{background:var(--sun);color:var(--sun-ink)} .sideN.f{background:#fff;color:#1d2b3a}
#vs>span{font-weight:900;font-size:24px;text-shadow:0 2px 0 #1d2b3a}
.unit{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);transition:opacity .5s, filter .3s}
.unit img{height:min(30vh,32vw);display:block;pointer-events:none}
.unit.boss img{height:min(44vh,36vw)}
.unit::after{content:"";position:absolute;bottom:-6px;left:15%;right:15%;height:16px;background:rgba(0,0,0,.3);border-radius:50%;z-index:-1}
.unit.out{opacity:0}
.unit.cold{filter:hue-rotate(160deg) saturate(.6) brightness(1.25)}
.hp{width:clamp(54px,9vw,96px);height:12px;border-radius:7px;background:rgba(10,18,40,.75);border:2px solid #1d2b3a;overflow:hidden;margin-bottom:3px}
.hp i{display:block;height:100%;width:100%;transition:width .3s}
.unit.h .hp i{background:#4aa8ff} .unit.f .hp i{background:#ff9f43}
.ch{width:clamp(54px,9vw,96px);height:7px;border-radius:4px;background:rgba(10,18,40,.75);border:2px solid #1d2b3a;overflow:hidden;margin-bottom:4px}
.ch i{display:block;height:100%;width:0;background:var(--sun);transition:width .3s}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(24px,5vw,40px);color:#fff;-webkit-text-stroke:5px #1d2b3a;paint-order:stroke fill;pointer-events:none;z-index:300;white-space:nowrap}
.pop.heal{color:#8fd0ff}
.pop.move{color:var(--sun);font-size:clamp(20px,4vw,34px);letter-spacing:.05em}
#bEnd .pill{display:inline-flex;margin:6px 4px 12px;font-size:24px}
#bStars{display:flex;justify-content:center;gap:8px;margin:8px 0 6px}
#bStars svg{width:54px;height:54px}
#bStars svg.no{opacity:.28;transform:scale(.72)}
#bStars svg.yes{animation:star .5s backwards cubic-bezier(.3,1.6,.5,1)}
#bNews{font-weight:900;font-size:18px;letter-spacing:.04em;margin:0 0 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
#bNews img{width:64px;height:64px;object-fit:contain;border-radius:14px;background:rgba(255,210,63,.22);border:3px solid var(--sun)}
#bLostNums{display:flex;justify-content:center;gap:12px;align-items:center;margin:10px 0 14px}

/* ---------- potion lab ---------- */
#lab{background:#1b1630 center/cover}
#labCard{flex:1;min-height:0;margin-top:10px;border-radius:26px;background:rgba(14,22,48,.8);border:4px solid var(--sun);padding:14px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.4vh,22px);overflow:hidden}
#labCard h2{margin:0;font-size:clamp(15px,2.8vw,20px);letter-spacing:.1em;font-weight:900}
#sum{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,20px);flex-wrap:wrap}
.grp{background:rgba(255,255,255,.1);border-radius:18px;padding:8px 10px 4px;display:flex;flex-direction:column;align-items:center}
.bots{display:grid;grid-template-columns:repeat(5,auto);gap:2px 4px;justify-content:center}
.bots img{width:clamp(22px,4.6vw,46px);height:clamp(33px,6.9vw,68px);object-fit:contain}
.bots img.gone{opacity:.22;filter:grayscale(1)}
.grp b, .op{font-size:clamp(34px,7vw,56px);font-weight:900;line-height:1.1}
.qm{min-width:clamp(64px,12vw,110px);height:clamp(76px,14vw,130px);border-radius:20px;border:5px dashed var(--sun);display:grid;place-items:center;font-size:clamp(40px,8vw,68px);font-weight:900;color:var(--sun);padding:0 8px}
#answers{display:flex;justify-content:center;gap:clamp(12px,3vw,26px)}
.ans{width:clamp(84px,17vw,130px);height:clamp(72px,14vw,108px);border-radius:24px;background:var(--sun);color:var(--sun-ink);font-size:clamp(38px,8vw,60px);font-weight:900;display:grid;place-items:center;box-shadow:0 7px 0 rgba(0,0,0,.3)}
.ans:active{transform:translateY(3px)}
.ans.no{background:var(--quiet);color:rgba(255,255,255,.45);box-shadow:none}
.ans.yes{background:#fff;color:#14213d}
#brew{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:900;font-size:clamp(12px,2.2vw,17px);letter-spacing:.06em}
#brew span{white-space:nowrap}
#brew span:first-child{white-space:normal}
#brew i{width:24px;height:24px;border-radius:50%;border:3px solid var(--sun);display:inline-block;margin-left:6px;transition:background .3s}
#brew i.on{background:var(--sun)}
#brew img{width:26px;height:38px;object-fit:contain}
#rungs{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.75;flex:none}
#rungs button{width:34px;height:30px;border-radius:10px;background:var(--quiet);font-weight:900;font-size:14px}
#rungs button.on{background:#fff;color:#14213d}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
@keyframes fly{to{transform:translateY(-60px) scale(1.6);opacity:0}}
</style>
</head>
<body>

<!-- home -->
<div id="home" class="screen on">
  <div class="top">
    <img class="face" src="jack.webp" alt="Jack giving a thumbs up">
    <h1>JACK'S<br>HERO SQUAD</h1>
    <div class="tl" aria-label="Team level">TEAM <b id="homeLv">1</b><div class="xp"><i id="homeXp"></i></div></div>
    <div class="pill"><span class="coin"></span><span id="homeCoins">0</span></div>
    <div class="pill"><img src="art/add.webp" alt="Potions"><span id="homePots">0</span></div>
    <button class="small" id="homeSound" aria-label="Sound on or off">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path id="homeWaves" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="tiles">
    <button class="tile" id="goCamp" style="background-image:url(art/back-meadow.webp)"><span class="who"><img src="art/hero.webp" alt=""><img src="art/ogre.webp" alt=""></span><span class="name">CAMPAIGN</span></button>
    <button class="tile" id="goAdv" style="background-image:url(scenes/01.webp)"><span class="name">ADVENTURE</span></button>
    <button class="tile" id="goSquad"><span class="who"><img src="art/frost-fairy.webp" alt=""><img src="art/hero.webp" alt=""><img src="art/flower-fairy.webp" alt=""></span><span class="name">HEROES</span></button>
    <button class="tile" id="goLab" style="background-image:url(art/back-cave.webp)"><span class="who"><img src="art/add.webp" alt=""></span><span class="name">POTION LAB</span></button>
  </div>
</div>

<!-- campaign stages -->
<div id="camp" class="screen" style="overflow-y:auto">
  <div class="top">
    <button class="small back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>

<!-- heroes -->
<div id="squad" class="screen">

    <button class="small back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>

      <div id="teamRow"></div>

};

/* ---------- a level in play ---------- */
const cv=$('cv'), c=cv.getContext('2d');
let G=null;          // the level being played
let busy=false;      // the hero is in the middle of something
let fx=[];           // floating numbers and sparkles
let tweens=[];
const now=()=>performance.now();
const key=(x,y)=>x+','+y;

function tween(ms, fn, steady){
  return new Promise(res=>{ tweens.push({t0:now(), ms, fn, res, steady}); });
}
const wait = ms => tween(ms, ()=>{});
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

function startLevel(i){
  const L=LEVELS[i];
  G={
    i, W:L.w, H:L.h, theme:L.theme,
    walls:new Set(L.walls.map(w=>key(w[0],w[1]))),
    ents:L.ents.map(e=>Object.assign({alive:true, sc:1, al:1, ox:0, oy:0, wob:0}, e)),
    hero:{x:L.hero.x, y:L.hero.y, fx:L.hero.x, fy:L.hero.y, p:L.hero.p, shown:L.hero.p, face:1, keys:0, ox:0, oy:0, sc:1, hop:0},
    hearts:3, hints:3, coins:0, done:false, hintUntil:0, acted:false, introUntil:now()+1100,
    cells:new Map(L.cells.map(q=>[key(q[0],q[1]), {x:q[0], y:q[1], h:q[2], t:q[3]}]))
  };
  G.order=[...G.cells.values()].sort((a,b)=>a.y-b.y || a.x-b.x);          // back rows first, for drawing
  G.topU=Math.min(...G.order.map(q=>q.y*SQUASH-(q.h+1)*RISE));           // highest point of the map, in squares
  // A level painted as one scene: the picture is the map, and each square has a standing spot on it
  // (fractions of the picture's width and height). Until the picture loads nothing is drawn.
  G.scene=null; G.wait=false;
  if(L.scene){
    G.wait=true;
    const im=scenes[L.scene.src] || (scenes[L.scene.src]=new Image());
    const ok=()=>{ if(G && G.i===i){ G.scene={im, w:L.scene.w, h:L.scene.h, spots:L.spots}; G.wait=false; resize(); } };
    const no=()=>{ if(G && G.i===i) G.wait=false; };              // no picture: fall back to the pieced-together map
    if(ready(im)) ok(); else{ im.addEventListener('load', ok, {once:true}); im.addEventListener('error', no, {once:true}); if(!im.src) im.src=L.scene.src; }
  }
  cam.free=false;
  busy=false; fx=[]; tweens=[];
  $('won').classList.remove('on'); $('lost').classList.remove('on');
  $('lvlName').textContent=i+1;
  hud(); show('game'); resize();
}
function hud(){
  $('hearts').innerHTML=[0,1,2].map(n=>HEART.replace('<svg','<svg class="'+(n<G.hearts?'':'gone')+'"')).join('');
  $('coins').textContent=save.coins+G.coins;
  $('hintN').textContent=G.hints;
  $('hintBtn').disabled=G.hints<1;
}

const entAt=(x,y)=>G.ents.find(e=>e.alive && e.x===x && e.y===y);
const cellAt=(x,y)=>G.cells.get(key(x,y));
const inside=(x,y)=>G.cells.has(key(x,y));
const open=(x,y)=>inside(x,y) && !G.walls.has(key(x,y)) && !entAt(x,y);
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
/* Height of a square along one side. Stairs (n rises to the back, e to the right, w to the left)
   are low on one side, high on the other, and closed on the two sides between. */
function edgeHeight(q, dx, dy){
  if(q.t==='f'||q.t==='b') return q.h;
  if(q.t==='n') return dy<0 ? q.h+1 : dy>0 ? q.h : null;
  if(q.t==='e') return dx>0 ? q.h+1 : dx<0 ? q.h : null;
  return dx<0 ? q.h+1 : dx>0 ? q.h : null;
}
function canStep(ax,ay,bx,by){
  const a=cellAt(ax,ay), b=cellAt(bx,by);
  if(!a||!b) return false;
  const ha=edgeHeight(a,bx-ax,by-ay), hb=edgeHeight(b,ax-bx,ay-by);
  return ha!==null && ha===hb;
}
/* how high the ground is under a spot (spots are in squares and may be between squares) */
function heightAt(fx, fy){
  const cx=Math.round(fx), cy=Math.round(fy), q=cellAt(cx,cy);
  if(!q) return 0;
  if(q.t==='n') return q.h+(.5-(fy-cy));
  if(q.t==='e') return q.h+(.5+(fx-cx));
  if(q.t==='w') return q.h+(.5-(fx-cx));
  return q.h;
}

/* every floor square the hero can walk to, with the square he came from */
function flood(){
  const from=new Map([[key(G.hero.x,G.hero.y), null]]), q=[[G.hero.x,G.hero.y]];
  while(q.length){
    const [x,y]=q.shift();
    for(const [dx,dy] of DIRS){
      const nx=x+dx, ny=y+dy, k=key(nx,ny);
      if(open(nx,ny) && !from.has(k) && canStep(x,y,nx,ny)){ from.set(k,[x,y]); q.push([nx,ny]); }
    }
  }
  return from;
}
function pathTo(from, x, y){
  const path=[]; let cur=[x,y];
  while(cur){ path.unshift(cur); cur=from.get(key(cur[0],cur[1])); }
  return path.slice(1);
}
/* the nearest square next to something, or null if he cannot get there */
function standBeside(e, from){
  let best=null, bestLen=1e9;
  for(const [dx,dy] of DIRS){
    const x=e.x+dx, y=e.y+dy;
    if(!from.has(key(x,y)) || !canStep(x,y,e.x,e.y)) continue;
    const p=pathTo(from,x,y);
    if(p.length<bestLen){ best=p; bestLen=p.length; }
  }
  return best;
}
function canDo(e){
  if(e.t==='mon'||e.t==='boss') return G.hero.p>=e.n;
  if(e.t==='door') return G.hero.keys>0;
  return true;
}
function movesLeft(){
  const from=flood();
  return G.ents.filter(e=>e.alive && canDo(e) && standBeside(e,from));
}

/* can he walk straight between two spots without clipping a corner? (spots are in squares) */
function clearLine(ax,ay,bx,by){
  const a=cellAt(ax,ay);
  if(!a || a.t!=='f') return false;                  // corners are only cut across one flat platform
  const n=Math.max(1,Math.ceil(Math.hypot(bx-ax,by-ay)*5));
  for(let i=0;i<=n;i++){
    const x=ax+(bx-ax)*i/n+.5, y=ay+(by-ay)*i/n+.5;
    for(const [dx,dy] of [[-.3,-.3],[.3,-.3],[-.3,.3],[.3,.3]]){
      const cx=Math.floor(x+dx), cy=Math.floor(y+dy), q=cellAt(cx,cy);
      if(!q || q.t!=='f' || q.h!==a.h || !open(cx,cy)) return false;
    }
  }
  return true;
}
async function walk(path){
  const h=G.hero;
  if(!path.length) return;
  cam.free=false;
  const pts=[[h.x,h.y]].concat(path), legs=[];
  for(let i=0;i<pts.length-1;){                      // skip every corner he can cut
    let j=pts.length-1;
    while(j>i+1 && !clearLine(pts[i][0],pts[i][1],pts[j][0],pts[j][1])) j--;
    legs.push(pts[j]); i=j;
  }
  let stepAt=0;
  for(const [x,y] of legs){
    const sx=h.fx, sy=h.fy, far=Math.hypot(x-sx,(y-sy)*SQUASH);
    if(Math.abs(x-sx)>.05) h.face=x>sx?1:-1;
    await tween(far*230, t=>{
      h.fx=sx+(x-sx)*t; h.fy=sy+(y-sy)*t; h.hop=Math.abs(Math.sin(t*far*Math.PI*1.6));
      if(now()>stepAt){ sfx.step(); stepAt=now()+210; }
    }, true);
    h.fx=x; h.fy=y;
  }
  const last=legs[legs.length-1]; h.x=last[0]; h.y=last[1]; h.hop=0;
}
function faceTo(e){ if(e.x!==G.hero.x) G.hero.face=e.x>G.hero.x?1:-1; }
function lunge(e, far){
  const h=G.hero, dx=e.x-h.x, dy=e.y-h.y;
  return tween(220, t=>{ const s=Math.sin(t*Math.PI)*far; h.ox=dx*s; h.oy=dy*s; });
}
function floatText(x,y,text,col){ fx.push({kind:'text', x, y, text, col:col||'#fff', t0:now(), ms:900}); }
function sparkle(x,y,n,col){
  for(let i=0;i<n;i++){ const a=Math.random()*6.283, v=.6+Math.random()*1.2;
    fx.push({kind:'spark', x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-.6, col:col||'#ffd23f', t0:now(), ms:500+Math.random()*300}); }
}
function gain(n){ const h=G.hero; h.p=n; tween(450, t=>{ h.sc=1+.25*Math.sin(t*Math.PI); }); }
function vanish(e){ return tween(260, t=>{ e.sc=1-t; e.al=1-t; }).then(()=>{ e.alive=false; }); }
function shake(e){ return tween(320, t=>{ e.wob=Math.sin(t*Math.PI*5)*(1-t)*.12; }).then(()=>{ e.wob=0; }); }

async function act(e){
  const h=G.hero;
  faceTo(e);
  if(e.t==='mon'||e.t==='boss'){
    if(h.p>=e.n){
      await lunge(e,.45);
      sfx.win(); sparkle(e.x,e.y,14,'#fff');
      floatText(e.x,e.y,'+'+e.n,'#ffd23f');
      await vanish(e);
      gain(h.p+e.n); G.acted=true;
      if(e.t==='boss') return finish();
    }else{
      await lunge(e,.35);
      sfx.bonk();
      tween(350, t=>{ e.sc=1+.3*Math.sin(t*Math.PI); });
      await tween(380, t=>{ const s=Math.sin(t*Math.PI); h.ox=-(e.x-h.x)*s*.3; h.oy=-(e.y-h.y)*s*.3; h.sc=1-.2*s; });
      h.ox=h.oy=0; h.sc=1;
      G.hearts--; hud();
      if(G.hearts<1){ await wait(350); return lose(); }
    }
  }else if(e.t==='add'||e.t==='mul'){
    sfx.pick(); sparkle(e.x,e.y,10,'#ff8ad8');
    floatText(e.x,e.y,(e.t==='add'?'+':'×')+e.n,'#ffd23f');
    await vanish(e);
    gain(e.t==='add'?h.p+e.n:h.p*e.n); G.acted=true;
  }else if(e.t==='key'){
    sfx.pick(); sparkle(e.x,e.y,8); await vanish(e); h.keys++; G.acted=true;
  }else if(e.t==='chest'){
    sfx.pick(); sparkle(e.x,e.y,16); floatText(e.x,e.y,'+'+e.n,'#ffd23f');
    await vanish(e); G.coins+=e.n; hud(); G.acted=true;
  }else if(e.t==='door'){
    if(h.keys>0){ sfx.door(); h.keys--; await vanish(e); G.acted=true; }
    else{ sfx.nope(); floatText(e.x,e.y,'🔑','#fff'); await shake(e); }
  }
  if(!G.done && !movesLeft().length){ await wait(500); lose(); }
}

async function tapCell(x,y){
  if(!G || busy || G.done || G.wait || !inside(x,y)) return;
  busy=true;
  try{
    const from=flood(), e=entAt(x,y);
    if(e){
      const path=standBeside(e,from);
      if(!path){ sfx.nope(); floatText(G.hero.x,G.hero.y,'?','#fff'); await shake(e); }
      else{ await walk(path); await act(e); }
    }else if(from.has(key(x,y))){
      await walk(pathTo(from,x,y));
    }else sfx.nope();
  }finally{ busy=false; }
}

function finish(){
  G.done=true;
  const stars=G.hearts, earned=10+2*(G.i+1)+5*G.hearts+G.coins, had=starCount();
  save.coins+=earned; save.stars[G.i]=Math.max(save.stars[G.i]||0, stars); persist();
  sfx.cheer();
  for(let i=0;i<5;i++) setTimeout(()=>G&&sparkle(Math.random()*G.W, Math.random()*G.H, 12), i*160);
  setTimeout(()=>{
    $('stars').innerHTML=[0,1,2].map(n=>STAR.replace('<svg','<svg class="'+(n<stars?'yes':'no')+'" style="animation-delay:'+(n*.18)+'s"')).join('');
    $('wonCoins').textContent='+'+earned;
    const fresh=HEROES.find(h=>h.need>had && h.need<=starCount());
    $('newHero').style.display=fresh?'flex':'none';
    if(fresh) $('newHeroPic').src=ART_FILES[fresh.k]||'';
    $('wonNext').style.display=G.i+1<LEVELS.length?'':'none';
    $('coins').textContent=save.coins;
    $('won').classList.add('on');
  }, 900);
}
function lose(){ G.done=true; $('lost').classList.add('on'); }

$('homeBtn').onclick=$('wonMap').onclick=$('lostMap').onclick=()=>{ G=null; drawMap(); show('map'); };
$('againBtn').onclick=$('wonAgain').onclick=$('lostAgain').onclick=()=>startLevel(G.i);
$('wonNext').onclick=()=>startLevel(G.i+1);
$('hintBtn').onclick=()=>{
  if(!G || G.done || G.hints<1) return;
  G.hints--; G.hintUntil=now()+2600; hud(); sfx.pick();
};

/* ---------- drawing ---------- */
let cw=0, ch=0, ts=120, th=84;
const RISE=.46;                                  // how far one level of height lifts the ground, in squares
let eh=55;
const SQUASH=.7;                                // rows are much shorter than they are wide: the floor is seen at a low angle
const cam={x:0, y:0, free:false};               // top-left of the view, in screen pixels of the level
function resize(){
  const r=cv.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1, 2);
  cw=r.width; ch=r.height; cv.width=Math.round(cw*d); cv.height=Math.round(ch*d);
  c.setTransform(d,0,0,d,0,0);
  if(!G) return;
  ts=Math.max(84, Math.min(cw/5, ch/5.2, 180)); th=ts*SQUASH; eh=ts*RISE;
  const a=aimAt(G.hero.fx, G.hero.fy); cam.x=a[0]; cam.y=a[1];
}
addEventListener('resize', resize);
/* the level is bigger than the screen; the view follows the hero and stops at the level's edges */
function edges(){
  if(G.scene) return {l:0, r:G.scene.w*ts, t:0, b:G.scene.h*ts};
  return {l:-ts*1.2, r:G.W*ts+ts*1.2, t:G.topU*ts-ts*2.3, b:G.H*th+ts*1.5};
}
/* where a spot is on the painted scene, in screen pixels of the level; spots between squares are blended */
function spotAt(fx, fy){
  const S=G.scene.spots, x0=Math.floor(fx), y0=Math.floor(fy), tx=fx-x0, ty=fy-y0;
  let u=0, v=0, wsum=0;
  for(const [dx,dy,w] of [[0,0,(1-tx)*(1-ty)],[1,0,tx*(1-ty)],[0,1,(1-tx)*ty],[1,1,tx*ty]]){
    const q=w>1e-6 && S[key(x0+dx,y0+dy)];
    if(q){ u+=q[0]*w; v+=q[1]*w; wsum+=w; }
  }
  if(!wsum){ const q=S[key(Math.round(fx),Math.round(fy))]; return q ? [q[0]*G.scene.w*ts, q[1]*G.scene.h*ts] : null; }
  return [u/wsum*G.scene.w*ts, v/wsum*G.scene.h*ts];
}
function aimAt(fx, fy){
  const {l,r,t,b}=edges();
  let x=(fx+.5)*ts-cw/2, y=(fy+.5)*th-heightAt(fx,fy)*eh-ch*.58;
  const sp=G.scene && spotAt(fx,fy);
  if(sp){ x=sp[0]-cw/2; y=sp[1]-ch*.6; }
  x = r-l<=cw ? (l+r-cw)/2 : Math.max(l, Math.min(r-cw, x));
  y = b-t<=ch ? (t+b-ch)/2 : Math.max(t, Math.min(b-ch, y));
  return [x,y];
}
function toPx(x,y){
  const sp=G.scene && spotAt(x,y);                // on a painted scene the spot is where the feet go
  if(sp) return [sp[0]-ts/2-cam.x, sp[1]-th*.78-cam.y];
  return [x*ts-cam.x, y*th-heightAt(x,y)*eh-cam.y];
}
const depth = y => .9+.1*(y/Math.max(1,G.H-1));                 // nearer rows are a little bigger
function sizeOf(e){ return ts*(e.t==='boss'?1.6:e.t==='mon'?1.14:e.t==='door'?1.18:e.t==='chest'?.82:.72)*depth(e.y); }

/* a short touch is a tap; a moving touch slides the view so he can look around */
let touch=null;
cv.addEventListener('pointerdown', ev=>{
  if(!G) return;
  touch={x:ev.clientX, y:ev.clientY, cx:cam.x, cy:cam.y, moved:false};
  try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
});
cv.addEventListener('pointermove', ev=>{
  if(!G || !touch) return;
  const dx=ev.clientX-touch.x, dy=ev.clientY-touch.y;
  if(!touch.moved && Math.hypot(dx,dy)<12) return;
  touch.moved=true; cam.free=true; G.introUntil=0;
  const {l,r,t,b}=edges(), keepX=cam.x, keepY=cam.y;
  cam.x = r-l<=cw ? keepX : Math.max(l, Math.min(r-cw, touch.cx-dx));
  cam.y = b-t<=ch ? keepY : Math.max(t, Math.min(b-ch, touch.cy-dy));
});
cv.addEventListener('pointerup', ev=>{
  if(!G || !touch) return;
  const was=touch; touch=null;
  if(was.moved) return;
  const r=cv.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
  // characters stand taller than their spot, so a tap on a body counts for that character (front ones first)
  const front=G.ents.filter(e=>e.alive).sort((a,b)=>b.y-a.y);
  for(const e of front){
    const p=toPx(e.x,e.y), s=sizeOf(e), cx=p[0]+ts/2, feet=p[1]+th*.78;
    if(Math.abs(mx-cx)<s*.42 && my<feet+th*.25 && my>feet-tallness(e.k||e.t,s)-ts*.3) return tapCell(e.x,e.y);
  }
  if(G.scene){                                                    // nearest standing spot to the finger
    let best=null, bd=ts*.62;
    for(const q of G.order){ const p=toPx(q.x,q.y), d=Math.hypot(mx-(p[0]+ts/2), my-(p[1]+th*.6)); if(d<bd){ bd=d; best=q; } }
    if(best) tapCell(best.x,best.y);
    return;
  }
  for(let i=G.order.length-1;i>=0;i--){                           // nearest squares first
    const q=G.order[i], X=q.x*ts-cam.x, Y=q.y*th-(q.t==='f'||q.t==='b'?q.h:q.h+.5)*eh-cam.y;
    if(mx>=X && mx<X+ts && my>=Y && my<Y+th) return tapCell(q.x,q.y);
  }
});
cv.addEventListener('pointercancel', ()=>{ touch=null; });

function rr(x,y,w,h,r){ c.beginPath(); c.roundRect(x,y,w,h,r); }
function fillStroke(col, lw){ c.fillStyle=col; c.fill(); c.lineWidth=lw; c.strokeStyle=INK; c.stroke(); }
function eyes(s, y, gap, r){
  for(const sx of [-1,1]){
    c.beginPath(); c.arc(sx*gap, y, r, 0, 6.283); c.fillStyle='#fff'; c.fill(); c.lineWidth=s*.025; c.strokeStyle=INK; c.stroke();
    c.beginPath(); c.arc(sx*gap-r*.25, y+r*.1, r*.5, 0, 6.283); c.fillStyle=INK; c.fill();
  }
}
function smile(s, y, w, grumpy){
  c.beginPath();
  if(grumpy) c.arc(0, y+w*.7, w, Math.PI*1.2, Math.PI*1.8); else c.arc(0, y-w*.4, w, Math.PI*.2, Math.PI*.8);
  c.lineWidth=s*.04; c.lineCap='round'; c.strokeStyle=INK; c.stroke();
}
function tri(ax,ay,bx,by,cx2,cy2,col,lw){ c.beginPath(); c.moveTo(ax,ay); c.lineTo(bx,by); c.lineTo(cx2,cy2); c.closePath(); fillStroke(col,lw); }

const WATER=.95;                                 // how far below the lowest ground the water or chasm lies, in heights
function cliff(X, Y, w, hpx, T, wet, col){
  if(hpx<=0) return;
  const im=ART['cliff-'+G.theme];
  if(ready(im)){
    const iw=im.naturalWidth/3, tile=Math.floor(col/3), off=col-tile*3, flip=tile%2===1;
    const sh=Math.min(im.naturalHeight, hpx/ts*iw), top=Math.max(4, eh*.16);
    c.save();
    if(flip){ c.translate(X+w+.3, Y-top); c.scale(-1,1); c.drawImage(im, (2-off)*iw, 0, iw, sh, 0, 0, w+.6, hpx+top+.5); }
    else c.drawImage(im, off*iw, 0, iw, sh, X-.3, Y-top, w+.6, hpx+top+.5);
    c.restore();
    const g=c.createLinearGradient(0,Y+hpx*.35,0,Y+hpx); g.addColorStop(0,'rgba(6,12,30,0)'); g.addColorStop(1,'rgba(6,12,30,.45)');
    c.fillStyle=g; c.fillRect(X-.3, Y+hpx*.35, w+.6, hpx*.65+.5);            // cliffs darken toward the bottom
  }else{
    const g=c.createLinearGradient(0,Y,0,Y+hpx); g.addColorStop(0,T.face[0]); g.addColorStop(1,T.face[1]);
    c.fillStyle=g; c.fillRect(X-.3, Y, w+.6, hpx+.5);
    c.fillStyle='rgba(0,0,0,.14)';
    for(let k=1; k*eh*.34<hpx-2; k++) c.fillRect(X-.3, Y+k*eh*.34, w+.6, Math.max(1.5,ts*.012));
    c.fillStyle=T.lip; c.fillRect(X-.3, Y-1, w+.6, Math.max(3,eh*.13));
  }
  if(wet && T.foam){ c.fillStyle='rgba(255,255,255,'+T.foam+')'; c.fillRect(X-.3, Y+hpx-ts*.03, w+.6, ts*.035); }
}
/* the far scenery with its lower edge faded away, made once per picture */
const faded={};
function fadedBack(theme){
  const im=ART['back-'+theme];
  if(!ready(im)) return null;
  if(faded[theme]) return faded[theme];
  const k=document.createElement('canvas'); k.width=im.naturalWidth; k.height=im.naturalHeight;
  const x=k.getContext('2d'); x.drawImage(im,0,0);
  const g=x.createLinearGradient(0,k.height*.55,0,k.height); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,1)');
  x.globalCompositeOperation='destination-out'; x.fillStyle=g; x.fillRect(0,k.height*.55,k.width,k.height*.45+1);
  return faded[theme]=k;
}
function drawGround(t, T){
  if(G.scene){                                                    // the whole map is one painting
    c.fillStyle=T.deep[1]; c.fillRect(0,0,cw,ch);
    c.drawImage(G.scene.im, -cam.x, -cam.y, G.scene.w*ts, G.scene.h*ts);
    return;
  }
  // water or chasm below everything
  const g0=c.createLinearGradient(0,0,0,ch); g0.addColorStop(0,T.deep[0]); g0.addColorStop(1,T.deep[1]);
  c.fillStyle=g0; c.fillRect(0,0,cw,ch);
  const deep=ART['deep-'+G.theme], {l,r,t:tp,b}=edges();
  const kx=r-l>cw ? (cam.x-l)/(r-l-cw) : .5, ky=b-tp>ch ? (cam.y-tp)/(b-tp-ch) : 0;
  if(ready(deep)){
    if(!T.foam){                                                   // a chasm: one deep view that barely moves
      const k=Math.max(cw*1.12/deep.naturalWidth, ch*1.12/deep.naturalHeight), dw=deep.naturalWidth*k, dh=deep.naturalHeight*k;
      c.drawImage(deep, -(dw-cw)*kx, -(dh-ch)*ky, dw, dh);
    }else{                                                         // water: lies flat under the map and slides with it
      const tw=ts*4.6, tH=tw*deep.naturalHeight/deep.naturalWidth*.8, ox=-cam.x*.9, oy=-cam.y*.9;
      for(let i=Math.floor(-ox/tw); i*tw+ox<cw; i++) for(let j=Math.floor(-oy/tH); j*tH+oy<ch; j++){
        const fx=((i%2)+2)%2, fy=((j%2)+2)%2;
        c.save(); c.translate(i*tw+ox+(fx?tw:0), j*tH+oy+(fy?tH:0)); c.scale(fx?-1:1, fy?-1:1);
        c.drawImage(deep, 0, 0, tw+1, tH+1); c.restore();
      }
      c.fillStyle='rgba(10,30,70,.4)'; c.fillRect(0,0,cw,ch);            // pushed back so the platforms stand out
    }
  }
  // far scenery sits almost still while the map slides in front of it
  const back=fadedBack(G.theme);
  if(back){
    const bw=Math.max(cw*1.3, ch*1.5), bh=bw*back.height/back.width;
    c.drawImage(back, -(bw-cw)*kx, -bh*.12-ky*bh*.2, bw, bh);
  }
  const floor=ART['floor-'+G.theme], pic=ready(floor);
  const top=(q,X,Y,w,d)=>{                                        // the walked-on surface of a square
    if(pic){
      const iw=floor.naturalWidth/G.W, ih=floor.naturalHeight/G.H;
      c.drawImage(floor, q.x*iw+(X-(q.x*ts-cam.x))/ts*iw, q.y*ih, w/ts*iw, ih, X-.3, Y-.3, w+.6, d+.6);
      c.fillStyle=T.veil; c.fillRect(X-.3,Y-.3,w+.6,d+.6);
    }else{ c.fillStyle=(q.x+q.y)%2?T.a:T.b; c.fillRect(X-.3,Y-.3,w+.6,d+.6); }
    if(q.h){ c.fillStyle='rgba(255,255,255,'+(.06*q.h)+')'; c.fillRect(X-.3,Y-.3,w+.6,d+.6); }   // higher ground catches more light
  };
  for(const q of G.order){
    const X=q.x*ts-cam.x, Y0=q.y*th-cam.y;
    if(X>cw+ts || X<-ts*2 || Y0-(q.h+1)*eh>ch || Y0+th+(q.h+WATER)*eh<-ts) continue;
    const fr=cellAt(q.x,q.y+1), bk=cellAt(q.x,q.y-1), lf=cellAt(q.x-1,q.y), rt=cellAt(q.x+1,q.y);
    const frontH = fr ? (fr.t==='n' ? fr.h+1 : fr.t==='f'||fr.t==='b' ? fr.h : fr.h+1) : null;
    const drop = hh => frontH===null ? (hh+WATER)*eh : Math.max(0,hh-frontH)*eh;
    if(q.t==='b'){                                                // a plank bridge
      const Y=Y0-q.h*eh, across=!!(lf||rt);
      c.fillStyle='rgba(0,0,0,.22)';
      if(across) c.fillRect(X, Y+th*.3+(q.h+WATER)*eh, ts, th*.5); else c.fillRect(X+ts*.24, Y+(q.h+WATER)*eh+th*.1, ts*.52, th);
      const br=ART['bridge-away'];
      if(ready(br)){
        if(across){ c.save(); c.translate(X-ts*.04, Y+th*.5); c.rotate(-Math.PI/2); c.drawImage(br, -th*.43, 0, th*.86, ts*1.08); c.restore(); }
        else c.drawImage(br, X+ts*.16, Y-th*.06, ts*.68, th*1.12);
        continue;
      }
      c.fillStyle='#b98447'; c.strokeStyle='#5a371d'; c.lineWidth=Math.max(2,ts*.025);
      if(across){
        c.fillRect(X-1, Y+th*.16, ts+2, th*.68);
        c.beginPath(); for(let i=0;i<=5;i++){ c.moveTo(X+i*ts/5, Y+th*.16); c.lineTo(X+i*ts/5, Y+th*.84); } c.stroke();
        c.fillStyle='#5a371d'; c.fillRect(X-1, Y+th*.12, ts+2, th*.07); c.fillRect(X-1, Y+th*.81, ts+2, th*.09);
      }else{
        c.fillRect(X+ts*.2, Y-1, ts*.6, th+2);
        c.beginPath(); for(let i=0;i<=4;i++){ c.moveTo(X+ts*.2, Y+i*th/4); c.lineTo(X+ts*.8, Y+i*th/4); } c.stroke();
        c.fillStyle='#5a371d'; c.fillRect(X+ts*.16, Y-1, ts*.06, th+2); c.fillRect(X+ts*.78, Y-1, ts*.06, th+2);
      }
      continue;
    }
    if(q.t==='n'){                                                // stairs climbing to the back
      const st=ART['stairs-'+G.theme];
      if(ready(st)){ c.drawImage(st, X-.3, Y0-(q.h+1)*eh, ts+.6, th+eh+.5); continue; }
      for(let j=3;j>=0;j--){
        const hj=q.h+(j+1)/4, Y=Y0+(3-j)*th/4-hj*eh;
        c.fillStyle=T.step[0]; c.fillRect(X+ts*.06, Y, ts*.88, th/4+.5);
        c.fillStyle=T.step[1]; c.fillRect(X+ts*.06, Y+th/4, ts*.88, eh/4+.5);
      }
      c.fillStyle=T.face[1]; c.fillRect(X, Y0-(q.h+1)*eh, ts*.06, th+eh); c.fillRect(X+ts*.94, Y0-(q.h+1)*eh, ts*.06, th+eh);
      continue;
    }
    if(q.t==='e'||q.t==='w'){                                     // stairs climbing sideways
      const sd=ART['stairs-side-'+G.theme];
      if(ready(sd)){
        const base=Y0+th-q.h*eh, w=ts*1.16, hh=w*sd.naturalHeight/sd.naturalWidth;
        cliff(X, base, ts, drop(q.h), T, frontH===null, q.x);
        c.save(); c.translate(X+ts/2, base+ts*.04); if(q.t==='w') c.scale(-1,1);
        c.drawImage(sd, -w/2, -hh, w, hh); c.restore();
        continue;
      }
      for(let i=0;i<4;i++){
        const hi=q.h+((q.t==='e'?i:3-i)+1)/4, Y=Y0-hi*eh, x=X+i*ts/4;
        c.fillStyle=T.step[0]; c.fillRect(x-.3, Y, ts/4+.6, th);
        c.fillStyle='rgba(0,0,0,.12)'; c.fillRect(q.t==='e'?x:x+ts/4-ts*.03, Y, ts*.03, th);
        const d=drop(hi); c.fillStyle=T.step[1]; c.fillRect(x-.3, Y+th, ts/4+.6, d+.5);
        if(frontH===null && T.foam){ c.fillStyle='rgba(255,255,255,'+T.foam+')'; c.fillRect(x-.3, Y+th+d-ts*.03, ts/4+.6, ts*.035); }
      }
      continue;
    }
    const Y=Y0-q.h*eh;
    top(q, X, Y, ts, th);
    // shade where taller ground stands behind or beside, and a dark line along open edges
    const bkH = bk ? (bk.t==='f'||bk.t==='b' ? bk.h : bk.h+1) : -9;
    if(bkH>q.h){ const g=c.createLinearGradient(0,Y,0,Y+th*.55); g.addColorStop(0,'rgba(8,14,34,.38)'); g.addColorStop(1,'rgba(8,14,34,0)'); c.fillStyle=g; c.fillRect(X,Y,ts,th*.55); }
    if(lf && lf.t==='f' && lf.h>q.h){ const g=c.createLinearGradient(X,0,X+ts*.3,0); g.addColorStop(0,'rgba(8,14,34,.3)'); g.addColorStop(1,'rgba(8,14,34,0)'); c.fillStyle=g; c.fillRect(X,Y,ts*.3,th); }
    if(rt && rt.t==='f' && rt.h>q.h){ const g=c.createLinearGradient(X+ts,0,X+ts*.7,0); g.addColorStop(0,'rgba(8,14,34,.3)'); g.addColorStop(1,'rgba(8,14,34,0)'); c.fillStyle=g; c.fillRect(X+ts*.7,Y,ts*.3,th); }
    c.fillStyle='rgba(10,20,40,.35)'; const lw=Math.max(2,ts*.02);
    if(!bk) c.fillRect(X,Y,ts,lw);
    if(!lf || (lf.t==='f' && lf.h<q.h)) c.fillRect(X,Y,lw,th);
    if(!rt || (rt.t==='f' && rt.h<q.h)) c.fillRect(X+ts-lw,Y,lw,th);
    cliff(X, Y+th, ts, drop(q.h), T, frontH===null, q.x);

}
function badge(x, y, text, gold, big){
  const h=ts*(big?.27:.23); c.font='800 '+(h*.82)+'px '+FONT;
  const w=Math.max(h*1.25, c.measureText(text).width+h*.6);
  rr(x-w/2, y-h/2, w, h, h/2);

  c.fillStyle=gold?'#3b2b00':INK; c.textAlign='center'; c.textBaseline='middle'; c.fillText(text, x, y+h*.04);
}
function tallness(kind, s){ if(kind==='hero') kind=save.hero; const im=ART[kind]; return ready(im) ? Math.min(s, s*1.08*im.naturalHeight/im.naturalWidth) : s; }
function sprite(kind, x, feet, s, flip, sc, tilt){
  c.save(); c.translate(x, feet); if(tilt) c.rotate(tilt); c.scale((flip?-1:1)*sc, sc);
  const im=ART[kind==='hero' ? save.hero : kind];
  if(ready(im)){ const k=Math.min(s/im.naturalHeight, s*1.08/im.naturalWidth), w=im.naturalWidth*k, hh=im.naturalHeight*k; c.drawImage(im, -w/2, -hh, w, hh); }
  else{ c.lineJoin='round'; DRAW[kind](s); }

}

function frame(){
  requestAnimationFrame(frame);
  const t=now();
  for(const tw of tweens.slice()){
    const k=Math.min(1,(t-tw.t0)/tw.ms); tw.fn(tw.steady?k:ease(k));
    if(k>=1){ tweens.splice(tweens.indexOf(tw),1); tw.res(); }
  }
  if(!G) return;
  c.clearRect(0,0,cw,ch);
  if(G.wait) return;                              // the level's painting is still loading
  const th_=THEMES[G.theme], h=G.hero;
  h.shown+= (h.p-h.shown)*.2; if(Math.abs(h.p-h.shown)<.5) h.shown=h.p;

  // the view glides after the hero (at the start it shows the boss first)
  if(!cam.free){
    const boss=G.ents.find(e=>e.t==='boss');
    const a = t<G.introUntil && boss ? aimAt(boss.x, boss.y) : aimAt(h.fx, h.fy);
    cam.x+=(a[0]-cam.x)*.09; cam.y+=(a[1]-cam.y)*.09;
  }
  drawGround(t, th_);

  // who can he beat right now (for the lightbulb, and the pointing hand on level 1)
  const showHint = t<G.hintUntil || (G.i===0 && !G.acted && !busy);
  const good = showHint ? movesLeft() : [];

  // everything standing in the room, back to front
  const list=[];
  if(!G.scene) for(const w of G.walls){ const [x,y]=w.split(',').map(Number); list.push({wall:true, x, y, big:.86, p:toPx(x,y), row:y}); }   // painted scenes already show these
  for(const e of G.ents) if(e.alive){ const p=toPx(e.x,e.y); p[0]+=e.ox*ts; p[1]+=e.oy*th; list.push({e, p, row:e.y}); }
  { const p=toPx(h.fx,h.fy); p[0]+=h.ox*ts; p[1]+=h.oy*th; list.push({hero:true, p, row:h.fy+.01}); }
  if(G.scene) list.sort((a,b)=>a.p[1]-b.p[1] || a.p[0]-b.p[0]); else list.sort((a,b)=>a.row-b.row || a.p[0]-b.p[0]);
  const tags=[];
  for(const it of list){
    const cx=it.p[0]+ts/2, feet=it.p[1]+th*.78;
    if(cx<-ts*1.5 || cx>cw+ts*1.5 || feet<-ts || feet>ch+ts*2.2) continue;      // off screen
    if(it.wall){
      const wim=ART['wall-'+G.theme], s=ts*1.14*it.big;
      c.beginPath(); c.ellipse(cx, it.p[1]+th*.86, ts*.5*it.big, th*.24, 0, 0, 6.283); c.fillStyle='rgba(0,0,0,.28)'; c.fill();
      if(ready(wim)) sprite('wall-'+G.theme, cx, it.p[1]+th, s, false, 1, 0);
      else{                                          // a tall block with a top and a front face
        const m=ts*.04, top=it.p[1]-th*.35, lw=Math.max(2,ts*.03);
        rr(it.p[0]+m, top, ts-2*m, th*1.33, ts*.16); c.fillStyle=th_.wall; c.fill(); c.lineWidth=lw; c.strokeStyle=INK; c.stroke();
        rr(it.p[0]+m, top, ts-2*m, th*.9, ts*.16); c.fillStyle=th_.wallTop; c.fill(); c.stroke();
      }
      continue;
    }
    if(it.hero){
      const s=ts*1.26*depth(it.row), lift=h.hop*ts*.07;
      c.beginPath(); c.ellipse(cx, feet, s*.26*(1-h.hop*.2), th*.13, 0, 0, 6.283); c.fillStyle='rgba(0,0,0,.3)'; c.fill();
      sprite('hero', cx, feet-lift, s, h.face<0, h.sc, 0);
      tags.push({x:cx, y:feet-lift-tallness('hero',s)*h.sc-ts*.16, text:String(Math.round(h.shown)), gold:true, big:true});
      for(let k=0;k<h.keys;k++) sprite('key', cx-h.face*s*.36, feet-s*(.3+k*.2), ts*.4, false, 1, .5);
      continue;
    }
    const e=it.e, kind=e.k||e.t, s=sizeOf(e), still=e.t==='door';
    const breathe=still?1:1+.025*Math.sin(t/380+e.x*1.7+e.y);
    if(good.includes(e)){
      const pulse=.5+.5*Math.sin(t/160);
      c.beginPath(); c.ellipse(cx, feet, ts*(.5+.05*pulse), th*(.44+.05*pulse), 0, 0, 6.283);
      c.lineWidth=ts*.06; c.strokeStyle='rgba(255,255,255,'+(.6+.4*pulse)+')'; c.setLineDash([ts*.14, ts*.1]); c.stroke(); c.setLineDash([]);
    }
    c.beginPath(); c.ellipse(cx, feet, s*.3*e.sc, th*.15*e.sc, 0, 0, 6.283); c.fillStyle='rgba(0,0,0,'+(.3*e.al)+')'; c.fill();
    c.globalAlpha=e.al;
    c.save(); c.translate(cx, feet); c.scale(1, breathe); c.translate(-cx, -feet);
    sprite(kind, cx, feet, s, false, e.sc, e.wob);
    c.restore(); c.globalAlpha=1;
    const top=feet-tallness(kind,s)*e.sc-ts*.15;      // numbers ride above the head
    if(e.t==='mon'||e.t==='boss') tags.push({x:cx, y:top, text:String(e.n), big:e.t==='boss', al:e.al});
    else if(e.t==='add') tags.push({x:cx, y:top, text:'+'+e.n, al:e.al});
    else if(e.t==='mul') tags.push({x:cx, y:top, text:'×'+e.n, al:e.al});
    if(good.includes(e) && G.i===0) tags.push({x:cx, y:top-ts*.42+Math.sin(t/200)*ts*.07, hand:true});
  }
  // number tags go on top of everything so they can always be read
  for(const g of tags){
    if(g.hand){ c.font=(ts*.42)+'px '+FONT; c.textAlign='center'; c.textBaseline='middle'; c.fillText('👇', g.x, g.y); continue; }
    c.globalAlpha=g.al===undefined?1:g.al; badge(g.x, g.y, g.text, g.gold, g.big); c.globalAlpha=1;
  }
  // darker corners pull the eye to the middle of the scene
  const vg=c.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*.45,cw/2,ch/2,Math.max(cw,ch)*.75);
  vg.addColorStop(0,'rgba(5,10,28,0)'); vg.addColorStop(1,'rgba(5,10,28,.5)'); c.fillStyle=vg; c.fillRect(0,0,cw,ch);

  // floating numbers and sparkles
  for(const f of fx.slice()){
    const k=(t-f.t0)/f.ms; if(k>=1){ fx.splice(fx.indexOf(f),1); continue; }
    if(f.kind==='text'){
      const [px,py]=toPx(f.x,f.y);
      c.globalAlpha=1-k*k; c.font='900 '+(ts*.36)+'px '+FONT; c.textAlign='center'; c.textBaseline='middle';
      c.lineWidth=ts*.07; c.strokeStyle=INK; c.lineJoin='round';
      c.strokeText(f.text, px+ts/2, py-ts*.5-k*ts*.7); c.fillStyle=f.col; c.fillText(f.text, px+ts/2, py-ts*.5-k*ts*.7);
    }else{
      const [px,py]=toPx(f.x,f.y);
      c.globalAlpha=1-k; c.fillStyle=f.col;
      c.beginPath(); c.arc(px+ts/2+f.vx*k*ts*.8, py-ts*.1+(f.vy*k+k*k*.9)*ts*.8, ts*.05*(1-k*.5), 0, 6.283); c.fill();
    }
    c.globalAlpha=1;
  }
}

/* =====================================================================
   The squad outside Adventure: team level, hero levels, Campaign fights,
   and the Potion Lab.
     Campaign wins  -> experience -> TEAM LEVEL (more team places, higher hero levels)
     Adventure      -> coins      -> HERO LEVEL
     Potion Lab     -> potions    -> each hero's SPECIAL MOVE
   Nothing here runs on a timer or runs out: every mode can be played as often as he likes.
   ===================================================================== */
const SPECIALS={
  'hero':['BIG SWING','all'], 'flower-fairy':['HEALING SHOWER','heal'], 'frost-fairy':['BIG FREEZE','freeze'],
  'star-fairy':['STAR RAIN','all'], 'archer':['ARROW STORM','one'], 'princess':['SUN SHIELD','heal'],
  'sorceress':['LIGHTNING','all'], 'dragon-pup':['FIRE BREATH','all'], 'giant':['GROUND SMASH','one'], 'wolf-rider':['WOLF CHARGE','one']
};
const MAX_SP=5, STAGES=30;
const hIdx=k=>HEROES.findIndex(h=>h.k===k);
const hLv=k=>save.lv[k]||1, hSp=k=>save.sp[k]||1;
const powerOf=(k,lv,sp)=>8+hIdx(k)+3*(lv-1)+2*(sp-1);
const hPower=k=>powerOf(k,hLv(k),hSp(k));
const xpNeed=L=>15+10*L;
function teamLevel(){ let L=1, x=save.xp; while(x>=xpNeed(L)){ x-=xpNeed(L); L++; } return {L, x, need:xpNeed(L)}; }
const SLOT_AT=[1,1,1,6,10];                                   // team level that opens each place in the team
const slots=()=>SLOT_AT.filter(n=>teamLevel().L>=n).length;
const lvCost=k=>10+2*hLv(k), spCost=k=>hSp(k);
/* The team is always as full as it can be: open heroes fill empty places by themselves. */
function team(){
  const open=HEROES.filter(heroOpen).map(h=>h.k), n=slots();
  let t=(save.team||[]).filter((k,i,a)=>open.includes(k) && a.indexOf(k)===i).slice(0,n);
  for(const k of open){ if(t.length>=n) break; if(!t.includes(k)) t.push(k); }
  save.team=t; return t;
}
const teamPower=()=>team().reduce((a,k)=>a+hPower(k),0);

/* ---------- Campaign: who is waiting at each stage ---------- */
const FOE_KINDS=[['goblin','slime','mushroom'],['bat','skeleton','imp'],['imp','skeleton','bat']];
const FOE_BOSS=['ogre','dragon','yeti'];
/* Monster power at each stage, set from the team a steady player has by then. */
const FOE_POWER=[11,11,24,24,32,41,41,49,49,62,77,88,88,106,117,117,162,162,176,140,189,189,203,203,216,239,239,252,252,212];
const foePower=s=>FOE_POWER[s];
function stageFoes(s){
  const w=Math.min(2,Math.floor(s/PER_WORLD)), M=foePower(s), boss=s%PER_WORLD===PER_WORLD-1;
  const out=[];
  if(boss){
    const b=Math.round(M*.6), m=Math.round(M*.2);
    out.push({k:FOE_BOSS[w], n:b, boss:true}, {k:FOE_KINDS[w][0], n:m}, {k:FOE_KINDS[w][1], n:M-b-m});
  }else{
    const count=s<2?2:s<12?3:4, wts=[1.3,1,.8,.9].slice(0,count), tot=wts.reduce((a,b)=>a+b,0);
    let left=M;
    for(let i=0;i<count;i++){ const n=i===count-1?left:Math.max(1,Math.round(M*wts[i]/tot)); left-=n; out.push({k:FOE_KINDS[w][(s+i)%3], n:Math.max(1,n)}); }
  }
  return out;
}
/* ---------- the fight, worked out before it is shown ----------
   Sides take turns. A unit hits the enemy at the front; every fourth turn a hero uses a special move.
   Returns the list of things that happen, so the screen only has to play them back. */
function simulate(heroes, foes, seed){
  let sd=seed>>>0; const rnd=()=>{ sd=(sd*1664525+1013904223)>>>0; return sd/4294967296; };
  const U=[];
  heroes.forEach((h,i)=>U.push({id:U.length, side:0, k:h.k, atk:h.p, hp:h.p*5, max:h.p*5, sp:h.sp, ch:i%3, kind:SPECIALS[h.k][1]}));
  foes.forEach((f,i)=>U.push({id:U.length, side:1, k:f.k, atk:f.n, hp:f.n*5, max:f.n*5, boss:!!f.boss, ch:0, kind:f.boss?'all':null, sp:1}));
  const ev=[], alive=s=>U.filter(u=>u.side===s && u.hp>0), turn=[0,0];
  const hurt=(u,d,list)=>{ d=Math.max(1,Math.round(d)); u.hp=Math.max(0,u.hp-d); list.push({id:u.id, d, hp:u.hp, ko:u.hp<=0}); };
  let side=0, guard=0;
  while(alive(0).length && alive(1).length && guard++<600){
    const mine=alive(side), foe=alive(1-side);
    const u=mine[turn[side]++ % mine.length];
    if(u.frozen){ u.frozen=false; ev.push({t:'thaw', a:u.id}); side=1-side; continue; }
    const vary=.85+.3*rnd();
    if(u.kind && u.ch>=3){
      u.ch=0; const e={t:'special', a:u.id, kind:u.kind, hits:[]};
      if(u.kind==='all') for(const f of foe) hurt(f, u.atk*(u.boss?.6:.65+.15*u.sp)*vary, e.hits);
      else if(u.kind==='one') hurt(foe[0], u.atk*(2+.4*u.sp)*vary, e.hits);
      else if(u.kind==='freeze') for(const f of foe){ hurt(f, u.atk*(.3+.1*u.sp)*vary, e.hits); if(f.hp>0 && !f.boss) f.frozen=true; e.hits[e.hits.length-1].frozen=f.frozen; }
      else if(u.kind==='heal') for(const m of mine){ const d=Math.min(m.max-m.hp, Math.round(u.atk*(.7+.25*u.sp))); m.hp+=d; e.hits.push({id:m.id, d:-d, hp:m.hp}); }
      ev.push(e);
    }else{
      u.ch++; const e={t:'hit', a:u.id, hits:[]};
      // heroes gang up on the monster at the front; monsters spread their hits around the team
      hurt(side===0?foe[0]:foe[turn[1]%foe.length], u.atk*vary, e.hits); ev.push(e);
    }
    side=1-side;
  }
  const won=alive(0).length>0 && !alive(1).length, down=U.filter(u=>u.side===0 && u.hp<=0).length;
  return {units:U, ev, won, stars:won?(down===0?3:down===1?2:1):0};
}
const teamSpec=()=>team().map(k=>({k, p:hPower(k), sp:hSp(k)})).sort((a,b)=>b.p-a.p);
const stageOpen=s=>s===0 || (save.camp[s-1]||0)>0;

/* ---------- campaign: showing a fight ---------- */
let B=null;                                                   // the fight on screen
const H_SPOT=[[39,80],[27,93],[19,72],[9,88],[4,68]];        // where heroes stand, in hundredths of the field (feet)
const sleep=ms=>new Promise(r=>setTimeout(r, ms/(save.fast?2.2:1)));
function startBattle(s){
  const w=Math.min(2,Math.floor(s/PER_WORLD)), theme=['meadow','cave','ice'][w];
  const spec=teamSpec(), foes=stageFoes(s);

}
function setCharge(me, id){ const q=me.els[id], bar=q.el.querySelector('.ch i'); if(bar) bar.style.width=Math.min(100, q.ch/3*100)+'%'; }
function bPop(me, id, text, cls){
  const q=me.els[id], A=$('arena'), d=document.createElement('div'); d.className='pop '+(cls||''); d.textContent=text;
  d.style.left=q.x+'%'; d.style.top=(q.y-(cls==='move'?46:30))+'%'; A.appendChild(d);
  const a=d.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:0},{transform:'translate(-50%,-70%) scale(1.1)',opacity:1,offset:.2},{transform:'translate(-50%,-150%) scale(1)',opacity:0}],{duration:cls==='move'?1100:800,easing:'ease-out'});
  a.onfinish=()=>d.remove();
}
function bLunge(me, id, toId, big){
  const q=me.els[id], t=me.els[toId], A=$('arena');
  const dx=(t.x-q.x)/100*A.clientWidth*.45, dy=(t.y-q.y)/100*A.clientHeight*.45, base='translate(-50%,-100%)';
  q.el.animate([{transform:base},{transform:base+' translate('+dx+'px,'+dy+'px) scale('+(big?1.15:1)+')',offset:.45},{transform:base}],{duration:(big?420:300)/(save.fast?2:1),easing:'ease-in-out'});
}
function bLand(me, h){                                         // one unit takes a hit or is healed
  const q=me.els[h.id];
  q.el.querySelector('.hp i').style.width=Math.round(100*h.hp/q.max)+'%';
  if(h.d<0){ if(h.d) bPop(me, h.id, '+'+(-h.d), 'heal'); return; }
  bPop(me, h.id, '−'+h.d);
  q.el.animate([{filter:'brightness(2.2)'},{filter:'brightness(1)'}],{duration:220});
  if(h.frozen) q.el.classList.add('cold');
  if(h.ko) q.el.classList.add('out');
}
async function playBattle(me){
  const live=()=>B===me;
  await sleep(900);
  for(const e of me.sim.ev){
    if(!live()) return;
    const u=me.sim.units[e.a], q=me.els[e.a];
    if(e.t==='thaw'){ q.el.classList.remove('cold'); await sleep(260); continue; }
    if(e.t==='hit'){
      q.ch++; setCharge(me, e.a);
      bLunge(me, e.a, e.hits[0].id); await sleep(150);
      if(!live()) return;
      sfx.step(); tone(u.side?150:330,.07,'square',0,.06); bLand(me, e.hits[0]); await sleep(330);
    }else{
      q.ch=0; setCharge(me, e.a);
      if(u.side===0) bPop(me, e.a, SPECIALS[u.k][0]+'!', 'move');
      sfx.pick();
      q.el.animate([{filter:'brightness(1)'},{filter:'brightness(1.8) drop-shadow(0 0 14px #ffd23f)'},{filter:'brightness(1)'}],{duration:500});
      await sleep(420); if(!live()) return;
      if(e.kind!=='heal' && e.hits.length) bLunge(me, e.a, e.hits[0].id, true);
      await sleep(180); if(!live()) return;
      if(e.kind==='heal') tone(660,.25,'sine',0,.12); else sfx.bonk();
      for(const h of e.hits) bLand(me, h);
      await sleep(520);
    }
  }
  if(!live()) return;
  await sleep(500); if(!live()) return;
  endBattle(me);
}
function endBattle(me){
  const s=me.s, sim=me.sim;
  if(!sim.won){
    sfx.nope();
    $('bLostTeam').textContent=$('bTeam').textContent; $('bLostFoes').textContent=$('bFoes').textContent;
    $('bLost').classList.add('on'); return;
  }
  const first=!(save.camp[s]>0), had=starCount(), before=teamLevel().L, slotsBefore=slots();
  const xp=first?12+3*(s+1):6+(s+1);
  save.xp+=xp; save.camp[s]=Math.max(save.camp[s]||0, sim.stars);
  const after=teamLevel().L, fresh=HEROES.find(h=>h.need>had && h.need<=starCount());
  team(); persist(); sfx.cheer();
  $('bStars').innerHTML=[0,1,2].map(n=>STAR.replace('<svg','<svg class="'+(n<sim.stars?'yes':'no')+'" style="animation-delay:'+(n*.18)+'s"')).join('');
  $('bXp').textContent='+'+xp;
  let news='';
  if(after>before) news+='<span>TEAM LEVEL '+after+'!</span>';
  if(slots()>slotsBefore) news+='<span>ROOM FOR ONE MORE HERO!</span>';
  if(fresh) news+='<img src="'+ART_FILES[fresh.k]+'" alt=""><span>NEW HERO</span>';
  $('bNews').innerHTML=news; $('bNews').style.display=news?'flex':'none';
  $('bNext').style.display=s+1<STAGES?'':'none';
  $('bEnd').classList.add('on');
}
$('bFast').onclick=()=>{ save.fast=!save.fast; persist(); $('bFast').classList.toggle('dim', !save.fast); };
$('bMap').onclick=$('bLostMap').onclick=()=>{ B=null; drawCamp(); show('camp'); };
$('bAgain').onclick=$('bLostAgain').onclick=()=>startBattle(B.s);
$('bNext').onclick=()=>startBattle(B.s+1);
$('bTrain').onclick=()=>{ B=null; openSquad(); };

/* ---------- heroes ---------- */
let picked='hero';
function openSquad(){ if(!HEROES.some(h=>h.k===picked)) picked='hero'; drawSquad(); show('squad'); }
function drawSquad(note){
  bars('sq');
  const t=team(), cap=teamLevel().L, box=$('roster'); box.innerHTML='';
  for(const h of HEROES){
    const open=heroOpen(h), b=document.createElement('button');
    b.className='hc'+(h.k===picked?' sel':'')+(open?'':' shut');
    b.innerHTML='<img src="'+ART_FILES[h.k]+'" alt="">'+(open?'<span class="lvb">LV '+hLv(h.k)+'</span>'+(t.includes(h.k)?'<span class="in">'+TICK+'</span>':''):'<span class="need">★ '+h.need+'</span>');
    b.setAttribute('aria-label',h.name+(open?', level '+hLv(h.k)+(t.includes(h.k)?', in the team':''):', opens at '+h.need+' stars'));
    b.onclick=()=>{ picked=h.k; sfx.step(); drawSquad(); };
    box.appendChild(b);
  }
  const h=HEROES.find(x=>x.k===picked), open=heroOpen(h), lv=hLv(picked), sp=hSp(picked);
  $('pName').textContent=h.name.toUpperCase(); $('pPic').src=ART_FILES[picked];
  $('pPow').textContent=hPower(picked);
  $('pRight').style.visibility=open?'':'hidden';
  $('pNote').textContent=open?(note||''):'';
  if(!open){ $('pRight').style.visibility=''; $('pLv').innerHTML='★ '+h.need; $('pLvBtn').style.display=$('pSpBtn').style.display=$('pJoin').style.display='none'; $('pMove').textContent=SPECIALS[picked][0]; $('pSp').innerHTML='<i>★★★★★</i>'; $('pNote').textContent='Win '+(h.need-starCount())+' more stars to open this hero.'; }
  else{
    $('pLvBtn').style.display=$('pSpBtn').style.display='';
    const atCap=lv>=cap;
    $('pLv').innerHTML=atCap?String(lv):lv+' <span>→</span> '+(lv+1);
    $('pLvBtn').innerHTML=atCap?'TEAM LEVEL '+cap:'LEVEL UP <span class="coin"></span>'+lvCost(picked);
    $('pLvBtn').classList.toggle('dim', atCap || save.coins<lvCost(picked));
    $('pMove').textContent=SPECIALS[picked][0];
    $('pSp').innerHTML='★'.repeat(sp)+'<i>'+'★'.repeat(MAX_SP-sp)+'</i>';
    $('pSpBtn').innerHTML=sp>=MAX_SP?'ALL DONE':'POWER UP <img src="art/add.webp" alt="potions">'+spCost(picked);
    $('pSpBtn').classList.toggle('dim', sp>=MAX_SP || save.potions<spCost(picked));
    $('pJoin').style.display=t.includes(picked)?'none':'';
  }
  const row=$('teamRow'); row.innerHTML='<b>TEAM</b>';
  for(let i=0;i<SLOT_AT.length;i++){
    const d=document.createElement('div');
    if(i<slots()){ d.className='slot'; if(t[i]) d.innerHTML='<img src="'+ART_FILES[t[i]]+'" alt="'+HEROES.find(x=>x.k===t[i]).name+'">'; }
    else{ d.className='slot shut'; d.innerHTML='TEAM<br>LV '+SLOT_AT[i]; }
    row.appendChild(d);
  }
  const pw=document.createElement('div'); pw.className='pow'; pw.style.cssText='margin:0 0 0 auto;padding:2px 14px'; pw.innerHTML='<small>TEAM POWER</small><b style="font-size:24px">'+teamPower()+'</b>'; row.appendChild(pw);
}
$('pLvBtn').onclick=()=>{
  const cap=teamLevel().L, lv=hLv(picked);
  if(lv>=cap){ sfx.nope(); return drawSquad('Win Campaign fights to raise the team level. Then heroes can go higher.'); }
  if(save.coins<lvCost(picked)){ sfx.nope(); return drawSquad('Not enough coins yet. Play Adventure to win more.'); }
  save.coins-=lvCost(picked); save.lv[picked]=lv+1; persist(); sfx.win(); drawSquad();
  $('pPic').animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:350});
};
$('pSpBtn').onclick=()=>{
  const sp=hSp(picked);
  if(sp>=MAX_SP) return;
  if(save.potions<spCost(picked)){ sfx.nope(); return drawSquad('Not enough potions yet. Brew more in the Potion Lab.'); }
  save.potions-=spCost(picked); save.sp[picked]=sp+1; persist(); sfx.win(); drawSquad();
  $('pPic').animate([{filter:'brightness(1)'},{filter:'brightness(1.7) drop-shadow(0 0 14px #ffd23f)'},{filter:'brightness(1)'}],{duration:500});
};
$('pJoin').onclick=()=>{                                      // takes the place of the weakest hero when the team is full
  const t=team();
  if(t.length>=slots()){ let weak=0; t.forEach((k,i)=>{ if(hPower(k)<hPower(t[weak])) weak=i; }); t[weak]=picked; } else t.push(picked);
  save.team=t; persist(); sfx.pick(); drawSquad();
};

/* ---------- potion lab ----------
   Sums get harder a step at a time. Each step is a rung; more can be added to the end of the list
   (counting in tens, twos and fives, times tables). Three right answers brew one potion. */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const RUNGS=[
  ()=>{ const a=R(1,4), b=R(1,5-a); return {a,b,op:'+'}; },                               // adding, up to 5
  ()=>{ const t=R(6,10), a=R(1,t-1); return {a,b:t-a,op:'+'}; },                           // adding, up to 10
  ()=>{ const a=R(2,10), b=R(1,a); return {a,b,op:'−'}; },                                 // taking away, up to 10
  ()=>{ if(Math.random()<.5){ const t=R(11,20), a=R(Math.max(1,t-10),Math.min(10,t-1)); return {a,b:t-a,op:'+'}; } const a=R(11,20), b=R(1,10); return {a,b,op:'−'}; }   // both, up to 20
];
const BREW=3;
let Q=null;
function openLab(){ save.rung=Math.max(0,Math.min(RUNGS.length-1,save.rung|0)); newSum(); show('lab'); }
function newSum(){
  let q; do{ q=RUNGS[save.rung](); }while(Q && q.a===Q.a && q.b===Q.b && q.op===Q.op);
  q.ans=q.op==='+'?q.a+q.b:q.a-q.b; q.missed=false; Q=q;
  const set=new Set([q.ans]);
  while(set.size<3){ const n=q.ans+R(-2,2); if(n>=0) set.add(n); }
  q.opts=[...set].sort(()=>Math.random()-.5);
  drawLab();
}
const bottles=(n,gone)=>'<div class="bots">'+Array.from({length:n},(_,i)=>'<img src="art/add.webp" alt=""'+(i>=n-gone?' class="gone"':'')+'>').join('')+'</div>';
function drawLab(){
  const q=Q, pics=q.a<=10 && q.b<=10;
  $('labPots').textContent=save.potions;
  $('labAsk').textContent=q.op==='+'?'HOW MANY BOTTLES ALL TOGETHER?':'HOW MANY BOTTLES ARE LEFT?';
  let h;
  if(q.op==='+') h='<div class="grp">'+(pics?bottles(q.a,0):'')+'<b>'+q.a+'</b></div><div class="op">+</div><div class="grp">'+(pics?bottles(q.b,0):'')+'<b>'+q.b+'</b></div>';
  else h='<div class="grp">'+(q.a<=10?bottles(q.a,q.b):'')+'<b>'+q.a+' − '+q.b+'</b></div>';
  $('sum').innerHTML=h+'<div class="op">=</div><div class="qm" id="qm">?</div>';
  const box=$('answers'); box.innerHTML='';
  for(const n of q.opts){ const b=document.createElement('button'); b.className='ans'; b.textContent=n; b.setAttribute('aria-label','Answer '+n); b.onclick=()=>answer(n,b); box.appendChild(b); }
  drawBrew(); drawRungs();
}
function drawBrew(){
  $('brew').innerHTML='<span>'+BREW+' RIGHT ANSWERS BREW A POTION</span><span>'+Array.from({length:BREW},(_,i)=>'<i'+(i<save.brew?' class="on"':'')+'></i>').join('')+'</span><img src="art/add.webp" alt="">';
}
function drawRungs(){
  const box=$('rungs'); box.innerHTML='<span>GROWN-UPS: HOW HARD</span>';
  RUNGS.forEach((_,i)=>{ const b=document.createElement('button'); b.textContent=i+1; b.className=i===save.rung?'on':''; b.setAttribute('aria-label','Difficulty step '+(i+1)); b.onclick=()=>{ save.rung=i; save.run=0; save.slips=0; persist(); newSum(); }; box.appendChild(b); });
}
let labBusy=false;
function answer(n, b){
  if(labBusy || b.classList.contains('no')) return;
  const q=Q;
  if(n!==q.ans){                                              // wrong: that button goes quiet and he can try another
    b.classList.add('no'); b.classList.add('shake'); sfx.nope();
    if(!q.missed){ q.missed=true; save.run=0; save.slips=(save.slips||0)+1; save.spoil=(save.spoil||0)+1;
      if(save.spoil>=3){ save.spoil=0; save.brew=0; drawBrew(); }               // three misses spoil the brew
      persist(); }
    return;
  }
  labBusy=true; b.classList.add('yes'); $('qm').textContent=q.ans; $('qm').style.borderStyle='solid';
  if(q.missed){ sfx.pick(); }
  else{
    sfx.win(); save.run=(save.run||0)+1; save.slips=0; save.brew=(save.brew||0)+1; drawBrew();
    if(save.brew>=BREW){
      save.brew=0; save.spoil=0; save.potions++; sfx.cheer();
      const f=document.createElement('img'); f.src='art/add.webp'; f.alt=''; f.style.cssText='position:absolute;left:50%;top:50%;width:90px;margin:-70px 0 0 -45px;z-index:9;animation:fly .9s ease-out forwards;pointer-events:none';
      $('lab').appendChild(f); setTimeout(()=>f.remove(), 950);
      setTimeout(()=>{ $('labPots').textContent=save.potions; $('labPill').animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:400}); drawBrew(); }, 600);
    }
  }
  // six right in a row: one step harder. Two sums missed in a row: one step easier.
  if(save.run>=6 && save.rung<RUNGS.length-1){ save.rung++; save.run=0; }
  else if(save.slips>=2 && save.rung>0){ save.rung--; save.slips=0; save.run=0; }
  persist();
  setTimeout(()=>{ labBusy=false; if($('lab').classList.contains('on')) newSum(); }, save.brew===0 && !q.missed?1300:900);
}

drawHome();
requestAnimationFrame(frame);
try{ if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
